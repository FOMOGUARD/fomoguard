<script>
/* ---------------- storage ---------------- */
const LS = {
  principles: 'fomoguard_principles',
  portfolio: 'fomoguard_portfolio',
  journal: 'fomoguard_journal',
  transactions: 'fomoguard_transactions',
  factchecks: 'fomoguard_factchecks',
  snapshots: 'fomoguard_snapshots',
  settings: 'fomoguard_settings',
  fx: 'fomoguard_fx',
  market: 'fomoguard_market',
  dailyAnalysis: 'fomoguard_daily_analysis',
  newsKeywords: 'fomoguard_news_keywords',
  newsCache: 'fomoguard_news_cache',
  profile: 'fomoguard_profile',
  cashFlows: 'fomoguard_cash_flows',
  growth: 'fomoguard_growth'
};
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); if (typeof SYNCABLE_KEYS !== 'undefined' && SYNCABLE_KEYS.has(key)) scheduleCloudSync(); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));

const CENTER_TAB = 'factcheck';
const REORDERABLE = ['dashboard','portfolio','journal','principles','news','growth','settings'];
const DASH_SECTIONS = [
  { id:'quote', label:'오늘의 투자 격언', icon:'💬' },
  { id:'stats', label:'핵심 지표 요약', icon:'📊' },
  { id:'market', label:'오늘의 시장 &amp; AI 분석', icon:'📰' },
  { id:'treemap', label:'자산 트리맵', icon:'🗺️' },
  { id:'donuts', label:'비중 도넛 차트', icon:'🍩' },
  { id:'contribution', label:'종목별 수익 기여도', icon:'💹' },
  { id:'trend', label:'자산가치 추이', icon:'📈' },
  { id:'shortcuts', label:'포모체크 · 투자일지 바로가기', icon:'🔗' },
];

/* ================= AI PROVIDERS (멀티 AI 연동 + 키 자동인식) ================= */
const AI_PROVIDERS = {
  claude: { label:'Claude', keyPlaceholder:'sk-ant-...', defaultModel:'claude-sonnet-5', modelSuggestions:['claude-sonnet-5','claude-opus-5','claude-haiku-4-5-20251001'] },
  gemini: { label:'Gemini', keyPlaceholder:'AIza...', defaultModel:'gemini-3.6-flash', modelSuggestions:['gemini-3.6-flash','gemini-2.5-flash','gemini-3.1-pro-preview'] },
  openai: { label:'ChatGPT', keyPlaceholder:'sk-...', defaultModel:'gpt-4.1', modelSuggestions:['gpt-5','gpt-4.1','gpt-4o-mini'] },
  grok: { label:'Grok', keyPlaceholder:'xai-...', defaultModel:'grok-4', modelSuggestions:['grok-4','grok-3'] }
};
function detectProviderFromKey(key) {
  if (/^sk-ant-/.test(key)) return 'claude';
  if (/^AIza/.test(key)) return 'gemini';
  if (/^xai-/.test(key)) return 'grok';
  if (/^sk-/.test(key)) return 'openai';
  return null;
}
function isLikelyChatModel(id, provider) {
  if (provider !== 'openai' && provider !== 'grok') return true;
  const bad = ['embedding','whisper','tts','dall-e','moderation','babbage','davinci-002','image','audio','realtime'];
  const lower = id.toLowerCase();
  return !bad.some(b => lower.includes(b));
}
async function fetchModelList(provider, key) {
  try {
    if (provider === 'claude') {
      const res = await fetch('https://api.anthropic.com/v1/models', { headers: { 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' } });
      if (!res.ok) return null;
      const data = await res.json();
      return (data.data||[]).map(m=>m.id);
    }
    if (provider === 'gemini') {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      if (!res.ok) return null;
      const data = await res.json();
      return (data.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent')).map(m => m.name.replace('models/',''));
    }
    const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/models' : 'https://api.x.ai/v1/models';
    const res = await fetch(endpoint, { headers: { 'Authorization':`Bearer ${key}` } });
    if (!res.ok) return null;
    const data = await res.json();
    return (data.data||[]).map(m=>m.id).filter(id => isLikelyChatModel(id, provider)).sort();
  } catch(e) { return null; }
}
let modelListCache = { claude:[], gemini:[], openai:[], grok:[] };

let state = {
  principles: load(LS.principles, []),
  portfolio: load(LS.portfolio, []),
  journal: load(LS.journal, []),
  transactions: load(LS.transactions, []),
  factchecks: load(LS.factchecks, []),
  snapshots: load(LS.snapshots, []),
  fx: load(LS.fx, { rate: null, updatedAt: null }),
  marketSnapshot: load(LS.market, null),
  dailyAnalysis: load(LS.dailyAnalysis, null),
  newsKeywords: load(LS.newsKeywords, []),
  newsCache: load(LS.newsCache, {}),
  cashFlows: load(LS.cashFlows, []),
  profile: load(LS.profile, null),
  growth: load(LS.growth, { xp:0, lastLoginXpDate:null, fcXpDate:null, fcXpCount:0, journalXpDate:null, journalXpCount:0, quizAnsweredDate:null, quizCorrect:null, quizPickedIdx:null }),
  settings: load(LS.settings, { provider:'claude', apiKeys:{claude:'',gemini:'',openai:'',grok:''}, models:{claude:'claude-sonnet-5',gemini:'gemini-3.6-flash',openai:'gpt-4.1',grok:'grok-4'}, twelveDataKey:'', newsApiKey:'', tabOrder: REORDERABLE.slice(), dashboardOrder: DASH_SECTIONS.map(s=>s.id), dashboardHidden: [] })
};
function sanitizeSettings() {
  let order = (state.settings.tabOrder || []).filter(t => REORDERABLE.includes(t));
  REORDERABLE.forEach(t => { if (!order.includes(t)) order.push(t); });
  state.settings.tabOrder = order;
  const dashIds = DASH_SECTIONS.map(s=>s.id);
  let dashOrder = (state.settings.dashboardOrder || []).filter(id => dashIds.includes(id));
  dashIds.forEach(id => { if (!dashOrder.includes(id)) dashOrder.push(id); });
  state.settings.dashboardOrder = dashOrder;
  state.settings.dashboardHidden = (state.settings.dashboardHidden || []).filter(id => dashIds.includes(id));
  if (!state.settings.apiKeys) state.settings.apiKeys = { claude: state.settings.apiKey || '', gemini:'', openai:'', grok:'' };
  if (!state.settings.models) state.settings.models = { claude: state.settings.model || 'claude-sonnet-5', gemini:'gemini-3.6-flash', openai:'gpt-4.1', grok:'grok-4' };
  if (!state.settings.provider) state.settings.provider = 'claude';
  if (state.settings.newsApiKey === undefined) state.settings.newsApiKey = state.settings.marketauxKey || '';
  if (state.settings.twelveDataKey === undefined) state.settings.twelveDataKey = '';
}
sanitizeSettings();
function hasApiKey() { return !!(state.settings.apiKeys||{})[state.settings.provider]; }
function canUseAI() { return hasApiKey() || !!currentUser; }

const FREE_AI_DAILY_CAP = 3;
async function callFreeAI({ system, user, maxTokens=1024 }) {
  if (!supabaseClient || !currentUser) throw new Error('무료 AI를 쓰려면 먼저 Google 로그인을 해주세요. (또는 설정에서 본인 API 키를 등록하면 로그인 없이도 무제한으로 이용 가능해요)');
  const { data: { session } } = await supabaseClient.auth.getSession();
  const token = session?.access_token;
  if (!token) throw new Error('로그인 세션이 만료되었어요. 다시 로그인해주세요.');
  let res;
  try {
    res = await fetch('/ai-free', {
      method: 'POST',
      headers: { 'content-type':'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ system, user, maxTokens })
    });
  } catch (e) {
    throw new Error('무료 AI 서버에 연결하지 못했습니다. 잠시 후 다시 시도하거나, 설정에서 본인 API 키를 등록해보세요.');
  }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || `무료 AI 오류 (${res.status})`);
  return data.text || '';
}

function ownKeyApiError(providerLabel, status, rawText) {
  const hint = status === 429
    ? ' — 본인이 등록한 API 키의 요청 한도(또는 결제 설정)를 초과했어요. 해당 서비스의 콘솔에서 쿼터·결제 상태를 확인해주세요. 다른 모델을 선택해보는 것도 방법이에요(설정 > AI 모델).'
    : '';
  return new Error(`${providerLabel} API 오류 (${status})${hint}: ${rawText.slice(0,200)}`);
}
// 본인 키 호출이 실패하면(쿼터·결제 문제, 일시 오류 등 무엇이든) 무료 공유 경로로 자동 대체한다.
// 이러면 "본인 키에 문제가 생겨도 분석 자체는 일단 나온다"가 보장돼서, 이 기능이 통째로 멈추는
// 일은 더 이상 없어야 한다. 무료 경로까지 실패하면 그때는 원래(본인 키) 오류를 그대로 보여준다
// (그게 더 근본적인 원인일 가능성이 높아서).
async function callAI({ system, user, maxTokens=1024 }) {
  if (!hasApiKey()) return callFreeAI({ system, user, maxTokens });
  try {
    return await callAIWithOwnKey({ system, user, maxTokens });
  } catch (e) {
    try {
      const text = await callFreeAI({ system, user, maxTokens });
      toast(`등록하신 API 키 호출에 실패해 무료 AI로 대신 생성했어요. (${e.message.slice(0,60)})`, 'warn');
      return text;
    } catch (e2) {
      throw e;
    }
  }
}
async function callAIWithOwnKey({ system, user, maxTokens=1024 }) {
  const provider = state.settings.provider || 'claude';
  const apiKey = (state.settings.apiKeys||{})[provider];
  const model = (state.settings.models||{})[provider] || AI_PROVIDERS[provider].defaultModel;

  if (provider === 'claude') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model, max_tokens:maxTokens, system, messages:[{ role:'user', content:user }] })
    });
    if (!res.ok) throw ownKeyApiError('Claude', res.status, await res.text());
    const data = await res.json();
    return data.content?.[0]?.text || '';
  }
  if (provider === 'gemini') {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST', headers: { 'content-type':'application/json' },
      body: JSON.stringify({ system_instruction:{ parts:[{ text:system }] }, contents:[{ role:'user', parts:[{ text:user }] }], generationConfig:{ maxOutputTokens:maxTokens } })
    });
    if (!res.ok) throw ownKeyApiError('Gemini', res.status, await res.text());
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }
  const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.x.ai/v1/chat/completions';
  const res = await fetch(endpoint, {
    method: 'POST', headers: { 'content-type':'application/json', 'Authorization':`Bearer ${apiKey}` },
    body: JSON.stringify({ model, max_tokens:maxTokens, messages:[{ role:'system', content:system },{ role:'user', content:user }] })
  });
  if (!res.ok) throw ownKeyApiError(AI_PROVIDERS[provider].label, res.status, await res.text());
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

/* ---------------- toast ---------------- */
function toast(msg, type='info') {
  const colors = { info:'#3182f6', success:'#00c896', error:'#f04452', warn:'#ffb800' };
  const el = document.createElement('div');
  el.className = 'card px-4 py-3 text-sm shadow-lg fade-in max-w-full w-full';
  el.style.borderLeft = `4px solid ${colors[type]||colors.info}`;
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

async function initSupabaseAuth() {
  if (!isSupabaseConfigured()) return;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) await handleSupabaseSession(session, false);
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session && (!currentUser || currentUser.id !== session.user.id)) {
        handleSupabaseSession(session, true);
      } else if (event === 'SIGNED_OUT') {
        currentUser = null; state.profile = null; localStorage.removeItem(LS.profile);
        renderHeaderProfile();
        if (currentTab === 'settings') renderers.settings();
      }
    });
  } catch(e) {}

let tutorialStep = 0;
let tutorialNavWatcher = null;
function positionTutorialSpotlight(selector) {
  const dim = document.getElementById('tutorial-dim');
  const spot = document.getElementById('tutorial-spotlight');
  const tip = document.getElementById('tutorial-tooltip');
  const el = selector ? document.querySelector(selector) : null;
  if (!el) {
    spot.classList.add('hidden');
    dim.style.clipPath = 'none';
    const tw = tip.getBoundingClientRect().width || 300;
    const th = tip.getBoundingClientRect().height || 220;
    tip.style.left = Math.round((window.innerWidth-tw)/2)+'px';
    tip.style.top = Math.round((window.innerHeight-th)/2)+'px';
    return;
  }
  const rBefore = el.getBoundingClientRect();
  if (rBefore.top < 70 || rBefore.bottom > window.innerHeight - 90) {
    el.scrollIntoView({ block: 'center', behavior: 'auto' });
  }
  const r = el.getBoundingClientRect();
  const pad = 8;
  const x1 = Math.round(r.left-pad), y1 = Math.round(r.top-pad), x2 = Math.round(r.right+pad), y2 = Math.round(r.bottom+pad);
  spot.classList.remove('hidden');
  spot.style.top = y1+'px';
  spot.style.left = x1+'px';
  spot.style.width = (x2-x1)+'px';
  spot.style.height = (y2-y1)+'px';
  // 스포트라이트 부분만 밝게 뚫어주는 clip-path 구멍 (evenodd로 바깥 사각형 - 안쪽 사각형)
  dim.style.clipPath = `polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${x1}px ${y1}px, ${x2}px ${y1}px, ${x2}px ${y2}px, ${x1}px ${y2}px, ${x1}px ${y1}px)`;
  const tw = tip.offsetWidth || 300;
  const th = tip.offsetHeight || 220;
  const spaceBelow = window.innerHeight - r.bottom;
  let top;
  if (spaceBelow > th + 24 || spaceBelow > r.top) top = Math.min(r.bottom + pad + 12, window.innerHeight - th - 16);
  else top = Math.max(16, r.top - pad - 12 - th);
  let left = r.left + r.width/2 - tw/2;
  left = Math.max(16, Math.min(left, window.innerWidth - tw - 16));
  tip.style.top = Math.round(top)+'px';
  tip.style.left = Math.round(left)+'px';
}
function renderTutorialExplanation(step) {
  tutorialNavWatcher = null;
  document.getElementById('tutorial-img').src = `/mascot/${step.img}.png`;
  document.getElementById('tutorial-title').textContent = step.title;
  document.getElementById('tutorial-body').textContent = step.body;
  document.getElementById('tutorial-dots').innerHTML = TUTORIAL_STEPS.map((_,i)=>`<span class="tut-dot ${i===tutorialStep?'active':''}"></span>`).join('');
  document.getElementById('tutorial-navhint').classList.add('hidden');
  document.getElementById('tutorial-next').classList.remove('hidden');
  document.getElementById('tutorial-next').textContent = tutorialStep===TUTORIAL_STEPS.length-1 ? '모두 이해했어요! 시작하기 🚀' : '다음';
  requestAnimationFrame(() => requestAnimationFrame(() => positionTutorialSpotlight(step.target)));
}
function beginTutorialNavPrompt(idx) {
  const step = TUTORIAL_STEPS[idx];
  const flank = visibleFlank();
  let navTarget, navLabel, waitTab;
  if (step.tab === CENTER_TAB || flank.includes(step.tab) || step.tab === 'more') {
    navTarget = `[data-tab="${step.tab}"]`;
    navLabel = `👇 아래 "${TAB_META[step.tab] ? TAB_META[step.tab].label : '더보기'}" 버튼을 직접 눌러 이동해보세요`;
    waitTab = step.tab;
  } else if (currentTab !== 'more') {
    navTarget = `[data-tab="more"]`;
    navLabel = `👇 아래 "더보기" 버튼을 먼저 눌러주세요`;
    waitTab = 'more';
  } else {
    navTarget = `[data-goto="${step.tab}"]`;
    navLabel = `👇 "${TAB_META[step.tab].label}"을 직접 눌러 이동해보세요`;
    waitTab = step.tab;
  }
  document.getElementById('tutorial-img').src = `/mascot/${step.img}.png`;
  document.getElementById('tutorial-title').textContent = step.title;
  document.getElementById('tutorial-body').textContent = step.body;
  document.getElementById('tutorial-dots').innerHTML = TUTORIAL_STEPS.map((_,i)=>`<span class="tut-dot ${i===tutorialStep?'active':''}"></span>`).join('');
  const hint = document.getElementById('tutorial-navhint');
  hint.textContent = navLabel;
  hint.dataset.sel = navTarget;
  hint.classList.remove('hidden');
  document.getElementById('tutorial-next').classList.add('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => positionTutorialSpotlight(navTarget)));
  tutorialNavWatcher = { tab: waitTab, cb: () => {
    if (waitTab !== step.tab) { beginTutorialNavPrompt(idx); }
    else { tutorialStep = idx; renderTutorialExplanation(step); }
  }};
}
function goToTutorialStep(idx) {
  const step = TUTORIAL_STEPS[idx];

function safeUrl(u) { return /^https?:\/\//i.test(u||'') ? u : '#'; }
function timeAgo(ts) {
  if (!ts) return '정보 없음';
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `${hr}시간 전`;
  return `${Math.floor(hr/24)}일 전`;
}
function daysAgoLabel(dateStr) {
  const t = Date.parse(dateStr);
  if (isNaN(t)) return '';
  const days = Math.floor((Date.now()-t)/86400000);
  if (days <= 0) return '오늘';
  if (days === 1) return '어제';
  if (days < 7) return `${days}일 전`;
  return new Date(t).toISOString().slice(0,10);
}
function weekdayKR(dateStr) { const d = new Date(dateStr+'T00:00:00'); return ['일','월','화','수','목','금','토'][d.getDay()]; }
function retColor(ret) {
  if (ret > 15) return '#c81e2c';
  if (ret > 5) return '#e34350';
  if (ret > 0) return '#f2828c';
  if (ret === 0) return '#3a4152';
  if (ret > -5) return '#7fb0fb';
  if (ret > -15) return '#4f8bf5';
  return '#2563d9';
}
function dailyRetColor(ret) {
  if (ret === undefined || ret === null) return '#3a4152';
  if (ret > 3) return '#c81e2c';
  if (ret > 1) return '#e34350';
  if (ret > 0) return '#f2828c';
  if (ret === 0) return '#3a4152';
  if (ret > -1) return '#7fb0fb';
  if (ret > -3) return '#4f8bf5';
  return '#2563d9';
}
function quoteOfTheDay() {
  const pool = [...MARKET_QUOTES, ...MEME_QUOTES, ...MOVIE_QUOTES];
  return pool[Math.floor(Math.random()*pool.length)];
}

function pickMovieQuote(mood) {
  const pool = MOVIE_QUOTES.filter(q => q.mood === mood);
  const from = pool.length ? pool : MOVIE_QUOTES;
  return from[Math.floor(Math.random()*from.length)];
}

function openCompassQuiz() {
  let step = 0;
  const answers = [];
  function renderStep() {
    if (step < COMPASS_QUESTIONS.length) {
      const q = COMPASS_QUESTIONS[step];
      openModal(`🧭 투자 나침반 (${step+1}/${COMPASS_QUESTIONS.length})`, `
        <p class="text-sm font-semibold mb-4">${escapeHtml(q.q)}</p>
        <div class="space-y-2.5">
          ${q.options.map((o,i)=>`<button data-opt="${i}" class="row p-3.5 w-full text-left text-sm compass-opt">${escapeHtml(o.label)}</button>`).join('')}
        </div>
      `, step>0 ? `<button id="compass-back" class="btn-ghost px-4 py-2.5 rounded-xl text-sm">이전</button>` : '');
      document.querySelectorAll('.compass-opt').forEach(b => b.onclick = () => { answers[step] = q.options[+b.dataset.opt].tag; step++; renderStep(); });
      if (step>0) document.getElementById('compass-back').onclick = () => { step--; renderStep(); };
    } else {
      const tally = {};
      answers.forEach(t => { if (t) tally[t] = (tally[t]||0)+1; });
      let best = 'diversify', bestCount = -1;
      Object.entries(tally).forEach(([k,v]) => { if (v>bestCount) { best=k; bestCount=v; } });
      const meta = COMPASS_RESULT_META[best];
      const cat = INVESTOR_CATEGORIES[meta.catIndex];
      openModal('🧭 나의 투자 나침반 결과', `
        <div class="text-center mb-4"><span class="text-4xl">${meta.emoji}</span><p class="font-bold text-lg mt-2">${meta.title}</p><p class="text-xs text-muted mt-1">${meta.desc}</p></div>
        <div class="row p-3.5 mb-3"><p class="text-xs font-semibold text-brand mb-1">추천 카테고리 · ${cat.category}</p><p class="text-[11px] text-muted">${cat.desc}</p></div>
        <p class="text-xs text-muted mb-2">아래 항목을 내 투자 원칙에 바로 추가할 수 있어요.</p>
        <label class="row p-3 flex items-center gap-2.5 mb-2"><input type="checkbox" id="compass-add-summary" checked><span class="text-xs">나의 투자 나침반 결과 요약 추가</span></label>
        ${cat.investors.map((t,i)=>`<label class="row p-3 flex items-center gap-2.5 mb-2"><input type="checkbox" class="compass-add-investor" data-ii="${i}" checked><span class="text-xs">${t.name}의 원칙 추가</span></label>`).join('')}
      `, `
        <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm" onclick="closeModal()">닫기</button>
        <button id="compass-finish" class="btn-brand px-4 py-2.5 rounded-xl text-sm">선택 항목 추가</button>
      `);
      document.getElementById('compass-finish').onclick = () => {
        let count = 0;
        if (document.getElementById('compass-add-summary').checked) {
          const answerLabels = answers.map((t,i)=>COMPASS_QUESTIONS[i].options.find(o=>o.tag===t)?.label||'').filter(Boolean);
          state.principles.push({ id: uid(), title:'나의 투자 나침반 결과', body:`추천 유형: ${meta.title}\n${meta.desc}\n\n[답변 요약]\n${answerLabels.map(l=>'· '+l).join('\n')}`, source:'투자 나침반 테스트', createdAt: Date.now() });
          count++;
        }
        document.querySelectorAll('.compass-add-investor:checked').forEach(cb => {
          const t = cat.investors[+cb.dataset.ii];
          state.principles.push({ id: uid(), title:`${t.name}의 원칙`, body: t.points.map(p=>'· '+p).join('\n'), source: t.name, createdAt: Date.now() });
          count++;
        });
        save(LS.principles, state.principles);
        closeModal(); renderers.principles(); toast(`${count}개 원칙을 추가했습니다.`, 'success');
      };
    }
  }
  renderStep();
}

/* ================= PORTFOLIO / FX MATH ================= */
function holdingKRW(h) {
  const rate = state.fx.rate || 1;
  const factor = h.currency==='USD' ? rate : 1;
  return { value: h.quantity*h.currentPrice*factor, cost: h.quantity*h.avgPrice*factor };
}
function computePortfolioStats() {
  let totalValue=0, totalCost=0, coreValue=0, satValue=0, coreCost=0, satCost=0;
  state.portfolio.forEach(h => {
    const { value, cost } = holdingKRW(h);
    totalValue += value; totalCost += cost;

function realizedSummary() {

  const prev = prevEntries[prevEntries.length-1];
  const { totalValue } = computePortfolioStats();
  if (!(prev.totalValue > 0)) return null;
  const changeAmt = totalValue - prev.totalValue;

function seededShuffle(arr, seed) {
  const a = arr.slice();
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 48271) % 2147483647;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function todayQuiz() {
  const dayIdx = Math.floor(Date.now()/86400000);
  const base = QUIZ_BANK[dayIdx % QUIZ_BANK.length];
  const order = seededShuffle([0,1,2,3], dayIdx + 1);
  return { q: base.q, options: order.map(i => base.options[i]), answer: order.indexOf(base.answer), explain: base.explain };
}

function holdingRealizedPnL(holdingId) {
  let sum = 0;
  state.transactions.filter(t=>t.type==='sell' && t.holdingId===holdingId).forEach(t => {
    const factor = t.currency==='USD' ? (state.fx.rate||1) : 1;
    sum += t.realizedPnL*factor;
  });
  return sum;
}
function closedPositionsSummary() {
  const openIds = new Set(state.portfolio.map(h=>h.id));
  const map = {};
  state.transactions.filter(t=>t.type==='sell' && !openIds.has(t.holdingId)).forEach(t => {
    const factor = t.currency==='USD' ? (state.fx.rate||1) : 1;
    if (!map[t.holdingId]) map[t.holdingId] = { name:t.name, profit:0 };
    map[t.holdingId].profit += t.realizedPnL*factor;
  });
  return Object.values(map);
}
function snapshotToday() {
  const { totalValue, totalCost } = computePortfolioStats();
  const idx = state.snapshots.findIndex(s => s.date === todayStr());
  const entry = { date: todayStr(), totalValue, totalCost };
  if (idx >= 0) state.snapshots[idx] = entry; else state.snapshots.push(entry);
  state.snapshots.sort((a,b)=> a.date.localeCompare(b.date));
  save(LS.snapshots, state.snapshots);
}

// 종목별로 fetchLivePrice()를 써서 시세+전일대비를 갱신한다. fetchLivePrice 자체가
// "Twelve Data 키 있으면 우선 시도 -> 실패하면(키 없음/키 오류/일시 오류 등 무엇이든) /price-free로 대체"
// 로직을 이미 갖고 있어서, 여기서 키 유무로 분기하지 않고 항상 이 함수 하나로 통일한다.
// (예전엔 키가 있을 때 Twelve Data 배치 호출만 쓰고 실패시 대체 경로가 없어서, 키가 유효하지
// 않거나 일시적으로 오류가 나면 전 종목이 통째로 갱신 실패하는 버그가 있었음)
async function syncStockPrices() {
  const withTicker = state.portfolio.filter(h=>h.ticker);
  if (!withTicker.length) return { ok:0, fail:0, skipped:false };
  let ok=0, fail=0;
  const seen = {};
  for (const h of withTicker) {
    const cacheKey = `${h.ticker}|${h.exchange||''}`;
    if (!(cacheKey in seen)) {
      seen[cacheKey] = await fetchLivePrice(h.ticker, h.exchange);
      await new Promise(r=>setTimeout(r, 300));
    }
    const result = seen[cacheKey];
    if (result) {
      h.currentPrice = result.price; h.priceUpdatedAt = Date.now();
      h.dailyChangePct = result.changePct;
      ok++;
    } else fail++;
  }
  save(LS.portfolio, state.portfolio);
  return { ok, fail, skipped:false };
}
// 종목 시세 조회 - Twelve Data 키가 있으면 그걸 우선 쓰고, 없거나 실패하면
// API 키 등록 없이도 쓸 수 있는 무료 경로(/price-free, Yahoo Finance 기반)로 대체한다.
async function fetchLivePrice(ticker, exchange) {
  const key = state.settings.twelveDataKey;
  if (key) {
    try {
      let url = `https://api.twelvedata.com/quote?symbol=${encodeURIComponent(ticker)}&apikey=${encodeURIComponent(key)}`;
      if (exchange) url += `&exchange=${encodeURIComponent(exchange)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.close && !isNaN(+data.close)) return { price:+data.close, changePct:+(data.percent_change||0), source:'twelvedata' };
    } catch(e) {}
  }
  try {
    const res = await fetch('/price-free', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ticker, market: exchange==='KRX'?'KRX':'US' }) });
    if (res.ok) {
      const data = await res.json();
      if (data.price) return { price:+data.price, changePct: data.changePct!=null?+data.changePct:undefined, source:'free' };
    }
  } catch(e) {}
  return null;
}
async function fetchIndexQuote(freeMarket, twelveDataSymbol, twelveDataExchange) {
  const key = state.settings.twelveDataKey;
  if (key) {
    try {
      let url = `https://api.twelvedata.com/quote?symbol=${encodeURIComponent(twelveDataSymbol)}&apikey=${encodeURIComponent(key)}`;
      if (twelveDataExchange) url += `&exchange=${encodeURIComponent(twelveDataExchange)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.close) return { close:+data.close, pct:+(data.percent_change||0) };
    } catch(e) {}
  }
  try {
    const res = await fetch('/price-free', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ market: freeMarket }) });
    if (res.ok) {
      const data = await res.json();
      if (data.price) return { close:+data.price, pct: data.changePct!=null?+data.changePct:0 };
    }
  } catch(e) {}
  return null;
}

/* ================= 실시간 뉴스 (관심 키워드, GNews 기반 헤드라인+요약) ================= */
/* GNews 무료 플랜은 브라우저 직접 호출(CORS)이 localhost로 제한되어 있어, 배포된 도메인에서는
   서버 프록시(/news-proxy, Cloudflare Pages Functions)를 거쳐 호출한다.
   프록시는 한글 키워드일 경우 영문으로 번역해 해외 뉴스까지 함께 검색하고,
   비한국어 기사는 제목·요약을 한국어로 번역해서 돌려준다. */
const NEWS_CACHE_VERSION = 4;
const NEWS_POSITIVE_WORDS = ['급등','상승','신고가','사상 최고','최고치','호실적','실적 개선','실적 호조','흑자','흑자전환','수주','대박','성장세','성장','돌파','반등','강세','기대감','호재','확장','증가','인수 완료','깜짝 실적','최대 실적','목표가 상향','매수 의견','투자 확대','수출 호조','훈풍','청신호','순항','회복세','도약','surge','soar','rally','record high','beats expectations','beat estimates','profit','growth','upgrade','jump','rebound','outperform','boost','breakthrough','all-time high','soars','climbs','gains','strong demand','expansion'];
const NEWS_NEGATIVE_WORDS = ['급락','폭락','하락','적자','손실','리콜','소송','조사','제재','파산','감원','구조조정','경고','우려','부진','약세','위기','악재','벌금','규제 강화','목표가 하향','매도 의견','실적 부진','실적 쇼크','충격','타격','급감','철수','중단','논란','비상','최악','내림세','침체','투자 위험','risk','plunge','slump','crash','loss','lawsuit','recall','investigation','sanction','bankruptcy','layoff','warning','downgrade','probe','fine','sued','miss expectations','falls','drops','tumbles','slides','cuts jobs','shortage'];
function classifyNewsSentiment(text) {
  const t = (text || '').toLowerCase();
  let pos = 0, neg = 0;
  NEWS_POSITIVE_WORDS.forEach(w => { if (t.includes(w.toLowerCase())) pos++; });
  NEWS_NEGATIVE_WORDS.forEach(w => { if (t.includes(w.toLowerCase())) neg++; });
  if (pos === neg) return 'neutral';
  return pos > neg ? 'positive' : 'negative';
}
function isFreshNewsCache(cached) {
  return !!cached && cached.date === todayStr() && cached.v === NEWS_CACHE_VERSION;
}
async function fetchNewsForKeywordPaid(keyword, key) {
  const fromDate = new Date(Date.now() - 3*86400000).toISOString();
  let res;
  try {
    res = await fetch('/news-proxy', {
      method: 'POST',
      headers: { 'content-type':'application/json' },
      body: JSON.stringify({ keyword, apiKey:key, fromDate, max:10 })
    });
  } catch (e) {
    throw new Error('뉴스 서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }
  if (!res.ok) { const t = await res.text(); let msg; try { msg = JSON.parse(t).error; } catch(e) { msg = t; } throw new Error(msg || `뉴스 API 오류 (${res.status})`); }
  const data = await res.json();
  if (!Array.isArray(data.articles)) throw new Error('GNews 응답 형식이 예상과 다릅니다: ' + JSON.stringify(data).slice(0,200));
  return {
    totalFound: data.totalArticles ?? data.articles.length,
    articles: data.articles.map(a => {
      const title = a.titleKo||a.title||'', description = a.descriptionKo||a.description||'';
      return { title, url:a.url||'#', source:a.source?.name||'', publishedAt:a.publishedAt||'', description, translated:!!a.translated };
    }),
    translationLimited: !!data.translationLimited
  };
}
async function fetchNewsForKeywordFree(keyword) {
  let res;
  try {
    res = await fetch('/news-free', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword }) });
  } catch (e) {
    throw new Error('뉴스 서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }
  if (!res.ok) { const t = await res.text(); let msg; try { msg = JSON.parse(t).error; } catch(e) { msg = t; } throw new Error(msg || `뉴스 조회 오류 (${res.status})`); }
  const data = await res.json();
  if (!Array.isArray(data.articles)) throw new Error('뉴스 응답 형식이 예상과 다릅니다.');
  return {
    totalFound: data.totalArticles ?? data.articles.length,
    articles: data.articles.map(a => ({ title:a.title||'', url:a.url||'#', source:a.source||'', publishedAt:a.publishedAt||'', description:a.description||'', translated:!!a.translated })),
    translationLimited: !!data.translationLimited
  };
}
// 이미 본인 GNews 키를 등록한 계정은 그대로 GNews(유료) 경로를 쓰고,
// 등록하지 않은 계정은 키 없이도 쓸 수 있는 구글 뉴스 무료 경로를 자동으로 쓴다.
async function fetchNewsForKeyword(keyword) {
  const key = state.settings.newsApiKey;
  const { totalFound, articles, translationLimited } = key ? await fetchNewsForKeywordPaid(keyword, key) : await fetchNewsForKeywordFree(keyword);
  let items = articles.map(a => ({ ...a, sentiment: classifyNewsSentiment(`${a.title||''} ${a.description||''}`) }));
  const cutoff = Date.now() - 3*86400000;
  items = items.filter(it => { const t = Date.parse(it.publishedAt); return !isNaN(t) && t >= cutoff; });
  items.sort((a,b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));
  items = items.slice(0, 10);
  items.totalFound = totalFound;
  state.newsCache[keyword] = { date: todayStr(), items, totalFound: items.totalFound, v: NEWS_CACHE_VERSION, translationLimited: !!translationLimited };
  save(LS.newsCache, state.newsCache);
  return items;
}
async function fetchAllNewsKeywords() {
  if (!state.newsKeywords.length) return;
  for (const k of state.newsKeywords) {
    const cached = state.newsCache[k];
    if (isFreshNewsCache(cached)) continue;
    try { await fetchNewsForKeyword(k); } catch(e) {}
    await new Promise(r=>setTimeout(r, 900));
  }
}

async function loadKeywordNewsData(keyword, forceRefresh) {
  const cached = state.newsCache[keyword];

/* ================= TREEMAP (squarify) ================= */
function squarify(items, x, y, w, h) {
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const areaTotal = Math.max(w*h, 1);
  const scaled = items.map(i => ({ ...i, area: i.value/total*areaTotal })).sort((a,b)=>b.area-a.area);
  const rects = [];
  function worst(row, length) {
    if (!row.length) return Infinity;
    const sum = row.reduce((a,b)=>a+b.area,0);
    let rmax=-Infinity, rmin=Infinity;
    row.forEach(r => { if (r.area>rmax) rmax=r.area; if (r.area<rmin) rmin=r.area; });
    return Math.max((length*length*rmax)/(sum*sum), (sum*sum)/(length*length*rmin));
  }
  function layoutRow(row, x, y, w, h) {
    const sum = row.reduce((a,b)=>a+b.area,0);
    const out = [];
    if (w >= h) {
      const stripW = sum / h;
      let cy = y;
      row.forEach(it => { const rh = it.area/stripW; out.push({ ...it, rx:x, ry:cy, rw:stripW, rh }); cy += rh; });
      return { out, nx:x+stripW, ny:y, nw:w-stripW, nh:h };
    } else {
      const stripH = sum / w;
      let cx = x;
      row.forEach(it => { const rw = it.area/stripH; out.push({ ...it, rx:cx, ry:y, rw, rh:stripH }); cx += rw; });
      return { out, nx:x, ny:y+stripH, nw:w, nh:h-stripH };
    }
  }
  function recurse(remaining, row, x, y, w, h) {
    if (!remaining.length) { if (row.length) { const { out } = layoutRow(row,x,y,w,h); rects.push(...out); } return; }
    const length = Math.min(w,h);
    const next = remaining[0];
    const newRow = row.concat([next]);
    if (!row.length || worst(row,length) >= worst(newRow,length)) {
      recurse(remaining.slice(1), newRow, x, y, w, h);
    } else {
      const { out, nx, ny, nw, nh } = layoutRow(row, x, y, w, h);
      rects.push(...out);
      recurse(remaining, [], nx, ny, nw, nh);
    }
  }
  recurse(scaled, [], x, y, w, h);
  return rects;
}
let treemapMode = 'total';
function renderTreemap() {
  const container = document.getElementById('treemap-wrap');
  if (!container) return;
  const w = container.clientWidth;
  const totalH = 260;
  const coreHoldings = state.portfolio.filter(h=>h.type==='core');
  const satHoldings = state.portfolio.filter(h=>h.type!=='core');
  const coreVal = coreHoldings.reduce((s,h)=>s+holdingKRW(h).value,0);
  const satVal = satHoldings.reduce((s,h)=>s+holdingKRW(h).value,0);
  const totalVal = (coreVal+satVal) || 1;
  let hCore;
  if (coreVal>0 && satVal>0) { hCore = Math.min(Math.max(totalH*coreVal/totalVal, 50), totalH-50); }
  else if (coreVal>0) { hCore = totalH; } else { hCore = 0; }
  const hSat = totalH - hCore;
  const isDaily = treemapMode === 'daily';

  function bandHtml(holdings, val, label, bandH) {
    if (!holdings.length || bandH<=0) return '';
    const items = holdings.map(h => ({ h, value: Math.max(holdingKRW(h).value,1) }));
    const rects = squarify(items, 0, 0, w, bandH);
    const tiles = rects.map(r => {
      const h = r.h;
      const ret = isDaily ? h.dailyChangePct : (h.avgPrice>0 ? (h.currentPrice-h.avgPrice)/h.avgPrice*100 : 0);
      const color = isDaily ? dailyRetColor(ret) : retColor(ret);
      const showText = r.rw>44 && r.rh>28;
      const retLabel = (isDaily && ret===undefined) ? '-' : fmtPct(ret);
      return `<div class="absolute rounded-[6px] flex flex-col items-center justify-center overflow-hidden" style="left:${r.rx}px;top:${r.ry}px;width:${Math.max(r.rw-2,0)}px;height:${Math.max(r.rh-2,0)}px;background:${color}">
        ${showText ? `<span class="text-[11px] font-bold leading-tight px-1 truncate w-full text-center text-white">${escapeHtml(h.name)}</span><span class="text-[10px] leading-tight text-white/90">${retLabel}</span>` : ''}
      </div>`;
    }).join('');
    return `<p class="text-[11px] text-muted font-semibold mb-1">${label} · ${fmtWon(val)}</p><div class="relative mb-2" style="width:100%;height:${bandH}px">${tiles}</div>`;
  }
  container.innerHTML = bandHtml(coreHoldings, coreVal, '🔵 코어', hCore) + bandHtml(satHoldings, satVal, '🟢 알파', hSat);
  if (isDaily && state.portfolio.some(h=>h.dailyChangePct===undefined)) {
    container.innerHTML += `<p class="text-[10px] text-muted mt-1">회색 타일은 오늘 시세가 갱신되지 않은 종목이에요. "시세 새로고침"을 눌러보세요.</p>`;
  }
}

      });

};

function showFactCheckHistoryItem(id) {
  const record = state.factchecks.find(f => f.id === id);
  if (!record || !record.result) return;
  renderFactCheckResult(record.result, record);
  document.getElementById('fc-result').scrollIntoView({ behavior:'smooth', block:'start' });
}

function verdictStyle(v) {
  if (v === '위배') return { color:'text-bad', bg:'bg-bad/10', border:'border-bad/30', emoji:'🚫', mascot:'face-D' };
  if (v === '주의') return { color:'text-warn', bg:'bg-warn/10', border:'border-warn/30', emoji:'⚠️', mascot:'face-C' };
  return { color:'text-good', bg:'bg-good/10', border:'border-good/30', emoji:'✅', mascot:'face-F' };
}

async function updateFcPricePreview() {
  const preview = document.getElementById('fc-price-preview');
  if (!preview) return;
  const ticker = document.getElementById('fc-ticker').value.trim();
  const exchange = document.getElementById('fc-exchange').value;
  const qty = +document.getElementById('fc-qty').value;
  if (!ticker || !qty) { preview.textContent = ''; return; }
  preview.textContent = '시세 확인 중...';
  const quote = await fetchLivePrice(ticker, exchange);
  if (!quote) { preview.textContent = '실시간 시세를 찾지 못했어요. 종목명/시장을 다시 확인해주세요.'; return; }
  const currency = exchange==='KRX' ? 'KRW' : 'USD';
  const krwAmount = currency==='USD' ? qty*quote.price*(state.fx.rate||1) : qty*quote.price;
  preview.innerHTML = `현재가 ${fmtPrice(quote.price, currency)} × ${qty}주 ≈ <span class="text-brand font-semibold">${fmtWon(krwAmount)}</span>${quote.source==='free'?' <span class="text-[10px]">(무료 시세 기준)</span>':''}`;
}
async function runFactCheck() {
  const ticker = document.getElementById('fc-ticker').value.trim();
  const exchange = document.getElementById('fc-exchange').value;
  const qty = document.getElementById('fc-qty').value.trim();
  const reason = document.getElementById('fc-reason').value.trim();
  if (!ticker || !reason) { toast('종목명과 이유는 필수입니다.', 'warn'); return; }
  if (!canUseAI()) { toast('무료 AI를 쓰려면 Google 로그인을 해주세요. (또는 설정에서 본인 API 키 등록)', 'error'); switchTab('settings'); return; }

  const resultBox = document.getElementById('fc-result');
  resultBox.innerHTML = `<div class="card p-6 text-center text-sm text-muted">
    <div class="detective-wrap"><img src="/mascot/pose-detective.png" alt="" class="detective-img w-full h-full object-contain"></div>
    AI가 원칙을 대조하는 중<span class="loading-dots">...</span>
  </div>`;

  const currency = exchange==='KRX' ? 'KRW' : 'USD';
  let price = null, amount = null, priceSource = null;
  if (qty) {
    const quote = await fetchLivePrice(ticker, exchange);
    if (quote) {
      price = quote.price;
      priceSource = quote.source;
      amount = currency==='USD' ? (+qty)*price*(state.fx.rate||1) : (+qty)*price;
    }
  }

  const stats = computePortfolioStats();
  const principlesText = state.principles.length
    ? state.principles.map(p => `- [${p.source}] ${p.title}: ${p.body.replace(/\n/g,' ')}`).join('\n')
    : '(등록된 원칙 없음 — 일반적인 건전 투자 원칙 기준으로 판단할 것)';
  const portfolioText = state.portfolio.length
    ? state.portfolio.map(h => `- ${h.name}(${h.type==='core'?'코어':'알파'}): 평가금액 ${Math.round(holdingKRW(h).value).toLocaleString()}원`).join('\n')
    : '(등록된 보유 종목 없음)';
  const recentJournal = state.journal.slice(-3).map(j => `- ${j.date}: ${j.content.slice(0,80)}`).join('\n') || '(기록 없음)';

  const systemPrompt = `당신은 '투자워워'라는 개인 투자 집사 AI입니다. 사용자의 등록된 투자 원칙과 현재 포트폴리오, 최근 투자 일지를 참고하여, 사용자가 지금 하려는 투자가 그 원칙에 부합하는지 냉철하고 직설적으로 검증합니다. 근거 없는 응원이나 막연한 긍정은 금지합니다. 감정적 동조보다 사실과 논리를 우선하되, 무례하거나 모욕적이지는 않게 말합니다. 반드시 아래 JSON 형식으로만, 다른 텍스트 없이 답하세요:
{"verdict":"위배 | 주의 | 양호","score":0-100 사이 정수(원칙 부합도),"summary":"핵심 총평 한두 문장","reasons":["근거 또는 우려 사항 1","근거 2","근거 3"],"advice":"지금 취해야 할 구체적 행동 조언 두세 문장"}`;

  const investLines = [`종목: ${ticker}`];
  if (qty) {
    investLines.push(`매수 예정 수량: ${qty}주`);
    if (amount != null) {
      investLines.push(`실시간 현재가: ${fmtPrice(price, currency)}${priceSource==='free'?' (무료 시세 기준)':''}`);
      investLines.push(`환산 예정 금액: 약 ${Math.round(amount).toLocaleString()}원`);
    } else {
      investLines.push('(실시간 시세를 확인하지 못해 금액 환산 없이 수량만으로 판단할 것)');
    }
  } else {
    investLines.push('수량: 미입력');
  }
  const userPrompt = `[나의 투자 원칙]\n${principlesText}\n\n[현재 포트폴리오 요약]\n총 평가금액: ${Math.round(stats.totalValue).toLocaleString()}원, 누적 수익률: ${stats.returnPct.toFixed(1)}%\n${portfolioText}\n\n[최근 투자 일지]\n${recentJournal}\n\n[지금 하려는 투자]\n${investLines.join('\n')}\n이유: ${reason}\n\n위 정보를 바탕으로 이 투자가 나의 원칙에 부합하는지 JSON으로만 답변하세요.`;

  try {
    const text = await callAI({ system: systemPrompt, user: userPrompt, maxTokens: 2500 });
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('AI 응답을 해석할 수 없습니다.');
    const result = JSON.parse(jsonMatch[0]);

    const record = { id: uid(), date: todayStr(), ticker, exchange, qty: qty?+qty:null, price, amount, priceSource, reason, result };
    state.factchecks.push(record);
    save(LS.factchecks, state.factchecks);
    grantFactCheckXp();

    renderers.factcheck();
    renderFactCheckResult(result, record);
  } catch (err) {
    resultBox.innerHTML = `<div class="card p-5 border border-bad/30 text-sm">
      <p class="font-semibold text-bad mb-1">검증 실패</p>
      <p class="text-muted">${escapeHtml(err.message)}</p>
      <p class="text-xs text-muted mt-2">API 키가 올바른지, 크레딧이 남아있는지 설정에서 확인해주세요.</p>
    </div>`;
    toast('AI 호출 중 오류가 발생했습니다.', 'error');
  }
}

function renderFactCheckResult(result, record) {
  const box = document.getElementById('fc-result');
  if (!box) return;
  const s = verdictStyle(result.verdict);
  const mq = pickMovieQuote(result.verdict === '양호' ? 'good' : 'warn');
  box.innerHTML = `
    ${record ? `<div class="row p-3 mb-2 text-xs">
      <p><span class="font-semibold">${escapeHtml(record.ticker)}</span> <span class="text-muted">· ${escapeHtml(record.date)}${record.qty?' · '+record.qty+'주':''}${record.amount?' · 약 '+fmtWon(record.amount):''}</span></p>
      <p class="text-muted mt-1">"${escapeHtml(record.reason)}"</p>
    </div>` : ''}
    <div class="card p-5 border ${s.border} ${s.bg} fade-in">
      <div class="flex items-center gap-3 mb-3">
        <img src="/mascot/${s.mascot}.png" alt="" class="w-12 h-12 object-contain flex-shrink-0">
        <div>
          <p class="text-xl font-bold ${s.color}">${s.emoji} ${escapeHtml(result.verdict)}</p>
          <p class="text-xs text-muted">원칙 부합도 ${escapeHtml(String(result.score ?? '-'))}점</p>
        </div>
      </div>
      <p class="text-sm mb-3">${escapeHtml(result.summary||'')}</p>
      ${Array.isArray(result.reasons) && result.reasons.length ? `
        <ul class="text-sm list-disc list-inside space-y-1 mb-3 text-[#c6cbd9]">
          ${result.reasons.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}
        </ul>` : ''}
      <div class="border-t border-line pt-3 mt-3">
        <p class="text-xs text-muted mb-1">💡 조언</p>
        <p class="text-sm">${escapeHtml(result.advice||'')}</p>
      </div>
      <p class="text-[11px] text-muted italic mt-3">🎬 "${escapeHtml(mq.text)}" — ${escapeHtml(mq.who)}</p>
    </div>
  `;
}

    openModal(`${escapeHtml(h.name)} 거래하기`, `
      <div class="seg mb-4" id="trade-seg"><button data-m="buy" class="${mode==='buy'?'active':''}">매수</button><button data-m="sell" class="${mode==='sell'?'active':''}">매도</button></div>

        <div><label class="text-xs text-muted mb-1 block">수량</label><input id="tf-qty" type="number" placeholder="주식 수"></div>
        <div><label class="text-xs text-muted mb-1 block">${mode==='buy'?'매수':'매도'} 가격 (${cur} 기준, 1주당)</label><input id="tf-price" type="number" step="0.01" value="${h.currentPrice}"></div>
      </div>
      <div id="trade-preview" class="row p-3 mt-3 text-xs text-muted">수량과 가격을 입력하면 결과 미리보기가 표시됩니다.</div>
    `, `
      <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm" onclick="closeModal()">취소</button>
      <button id="tf-submit" class="btn-brand px-4 py-2.5 rounded-xl text-sm">${mode==='buy'?'매수 기록':'매도 기록'}</button>
    `);
    document.querySelectorAll('#trade-seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
    const updatePreview = () => {
      const qty = +document.getElementById('tf-qty').value || 0;
      const price = +document.getElementById('tf-price').value || 0;
      const box = document.getElementById('trade-preview');
      if (!qty || !price) { box.textContent = '수량과 가격을 입력하면 결과 미리보기가 표시됩니다.'; return; }
      if (mode === 'buy') {
        const newQty = h.quantity+qty;
        const newAvg = (h.quantity*h.avgPrice + qty*price)/newQty;
        box.innerHTML = `매수 후: ${newQty}주 · 평단 ${fmtPrice(newAvg,cur)}`;
      } else {
        if (qty > h.quantity) { box.innerHTML = `<span class="text-bad">보유 수량(${h.quantity}주)보다 많습니다.</span>`; return; }
        const pnl = (price-h.avgPrice)*qty;
        const pct = h.avgPrice>0 ? (price-h.avgPrice)/h.avgPrice*100 : 0;
        box.innerHTML = `매도 후: ${h.quantity-qty}주 남음 · 실현손익 <span class="${pnl>=0?'text-up':'text-down'}">${pnl>=0?'+':''}${fmtPrice(pnl,cur)} (${fmtPct(pct)})</span>`;
      }
    };
    document.getElementById('tf-qty').oninput = updatePreview;
    document.getElementById('tf-price').oninput = updatePreview;
    document.getElementById('tf-submit').onclick = () => {
      const qty = +document.getElementById('tf-qty').value;
      const price = +document.getElementById('tf-price').value;
      if (!qty || qty<=0 || !price || price<=0) { toast('수량과 가격을 올바르게 입력해주세요.', 'warn'); return; }
      if (mode==='sell' && qty > h.quantity) { toast('보유 수량보다 많이 팔 수 없습니다.', 'warn'); return; }
      if (mode === 'buy') {
        const newQty = h.quantity+qty;
        const newAvg = (h.quantity*h.avgPrice + qty*price)/newQty;
        h.quantity = newQty; h.avgPrice = newAvg; h.currentPrice = price;
        state.transactions.push({ id:uid(), date:todayStr(), holdingId:h.id, name:h.name, ticker:h.ticker, type:'buy', currency:cur, quantity:qty, price, avgPriceAtTime:newAvg, realizedPnL:null });
        recordCashFlow('buy', -(qty*price*(cur==='USD'?(state.fx.rate||1):1)), `${h.name} 매수`);
      } else {
        const pnl = (price-h.avgPrice)*qty;
        state.transactions.push({ id:uid(), date:todayStr(), holdingId:h.id, name:h.name, ticker:h.ticker, type:'sell', currency:cur, quantity:qty, price, avgPriceAtTime:h.avgPrice, realizedPnL:pnl });
        recordCashFlow('sell', qty*price*(cur==='USD'?(state.fx.rate||1):1), `${h.name} 매도`);
        h.quantity -= qty; h.currentPrice = price;
        if (h.quantity <= 0) { state.portfolio = state.portfolio.filter(x=>x.id!==h.id); }
      }
      save(LS.portfolio, state.portfolio); save(LS.transactions, state.transactions);
      snapshotToday();
      closeModal(); renderers.portfolio(); toast(mode==='buy' ? '매수 기록을 저장했습니다.' : '매도 기록을 저장했습니다.', 'success');
    };
  }
  render();
}

const ASSET_TYPE_HINTS = {
  satellite: ['레버리지','인버스','곱버스','2X','3X','테마','2차전지','메타버스','바이오','게임주','비트코인','이더리움','코인','BTC','ETH','스팩','SPAC','신규상장','IPO','공모주'],
  core: ['코스피200','KODEX 200','TIGER 200','S&P500','SPY','QQQ','VOO','VTI','나스닥100','전체시장','인덱스','삼성전자','SK하이닉스','애플','AAPL','마이크로소프트','MSFT','구글','GOOGL','알파벳','아마존','AMZN','버크셔','BRK','국고채','회사채','머니마켓','MMF']
};
function suggestAssetType(name, ticker) {
  const text = `${name} ${ticker}`.toUpperCase();
  if (ASSET_TYPE_HINTS.satellite.some(k => text.includes(k.toUpperCase()))) return 'satellite';
  if (ASSET_TYPE_HINTS.core.some(k => text.includes(k.toUpperCase()))) return 'core';
  return null;
}

    const v = e.target.value;
    const curSel = document.getElementById('hf-currency');
    if (v === 'KRX') curSel.value = 'KRW';
    else if (v === 'NASDAQ' || v === 'NYSE') curSel.value = 'USD';
  };
  if (isNew) {
    let typeTouchedByUser = false;
    const typeSel = document.getElementById('hf-type');
    const hint = document.getElementById('hf-type-hint');
    typeSel.onchange = () => { typeTouchedByUser = true; hint.classList.add('hidden'); };
    const applySuggestion = () => {
      if (typeTouchedByUser) return;
      const suggestion = suggestAssetType(document.getElementById('hf-name').value, document.getElementById('hf-ticker').value);
      if (suggestion) {
        typeSel.value = suggestion;
        hint.textContent = `🤖 종목명으로 미루어 "${suggestion==='core'?'코어':'알파'}"을 추천드려요. 마음에 안 들면 직접 바꿔주세요.`;
        hint.classList.remove('hidden');
      } else {
        hint.classList.add('hidden');
      }
    };

    document.getElementById('hf-ticker').addEventListener('input', applySuggestion);
  }
  document.getElementById('hf-save').onclick = () => {
    const name = document.getElementById('hf-name').value.trim();

    const ticker = document.getElementById('hf-ticker').value.trim();

    if (!name || !cur) { toast('필수 항목을 모두 입력해주세요.', 'warn'); return; }
    if (isNew) {
      const qty = +document.getElementById('hf-qty').value;
      const avg = +document.getElementById('hf-avg').value;
      if (!qty || !avg) { toast('수량과 매입가를 입력해주세요.', 'warn'); return; }
      const newHolding = { id: uid(), name, type, currency, quantity:qty, avgPrice:avg, currentPrice:cur, ticker, exchange, priceUpdatedAt:null };
      state.portfolio.push(newHolding);
      state.transactions.push({ id: uid(), date: todayStr(), holdingId:newHolding.id, name, ticker, type:'buy', currency, quantity:qty, price:avg, avgPriceAtTime:avg, realizedPnL:null });

    snapshotToday();
    closeModal(); renderers.portfolio(); toast('저장되었습니다.', 'success');
  };
}

function openCashFlowModal(mode) {
  mode = mode === 'withdraw' ? 'withdraw' : 'deposit';
  const balance = computeCashBalance();
  const history = [...state.cashFlows].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,10);
  const typeLabel = { deposit:'입금', withdraw:'출금', buy:'매수', sell:'매도' };
  openModal('현금 잔고', `
    <div class="row p-3 mb-4 text-center">
      <p class="text-[10px] text-muted mb-1">현재 현금 잔고</p>
      <p class="text-xl font-extrabold">${fmtWon(balance)}</p>
    </div>
    <div class="seg mb-3" id="cf-seg">
      <button data-m="deposit" class="${mode==='deposit'?'active':''}">입금</button>
      <button data-m="withdraw" class="${mode==='withdraw'?'active':''}">출금</button>
    </div>
    <div class="space-y-3 mb-4">
      <div class="flex gap-2">
        <div class="flex-1"><label class="text-xs text-muted mb-1 block">${mode==='deposit'?'입금액':'출금액'}</label><input id="cf-amount" type="number" placeholder="예: 1000000"></div>
        <div style="width:96px"><label class="text-xs text-muted mb-1 block">통화</label>
          <select id="cf-currency">
            <option value="KRW">원화 (₩)</option>
            <option value="USD">달러 ($)</option>
          </select>
        </div>
      </div>
      <p id="cf-fx-hint" class="text-[10px] text-muted hidden"></p>
      <div><label class="text-xs text-muted mb-1 block">메모 (선택)</label><input id="cf-note" type="text" placeholder="${mode==='deposit'?'예: 8월 정기 입금':'예: 생활비로 출금'}"></div>
    </div>
    <button id="cf-submit" class="btn-brand w-full py-3 rounded-xl text-sm font-bold mb-4">${mode==='deposit'?'입금 기록':'출금 기록'}</button>
    <p class="text-xs font-semibold mb-2">최근 내역</p>
    <div class="space-y-1.5 max-h-48 overflow-y-auto">
      ${history.length ? history.map(c => `
        <div class="row p-2.5 flex items-center justify-between text-xs">
          <div><span class="font-semibold">${typeLabel[c.type]||c.type}</span> <span class="text-muted">${escapeHtml(c.date)}${c.note?' · '+escapeHtml(c.note):''}${c.currency==='USD'&&c.originalAmount?' · $'+(+c.originalAmount).toLocaleString('en-US',{maximumFractionDigits:2}):''}</span></div>
          <span class="font-bold ${c.amountKRW>=0?'text-up':'text-down'}">${c.amountKRW>=0?'+':''}${fmtWon(c.amountKRW)}</span>
        </div>
      `).join('') : '<p class="text-xs text-muted text-center py-3">내역이 없습니다.</p>'}
    </div>
  `, `
    <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm w-full" onclick="closeModal()">닫기</button>
  `);
  document.querySelectorAll('#cf-seg button').forEach(b => b.onclick = () => openCashFlowModal(b.dataset.m));
  const curSel = document.getElementById('cf-currency');
  const fxHint = document.getElementById('cf-fx-hint');
  const updateFxHint = () => {
    if (curSel.value === 'USD') {
      fxHint.classList.remove('hidden');
      fxHint.textContent = state.fx.rate ? `현재 환율(1달러 ${Math.round(state.fx.rate).toLocaleString()}원)로 원화 환산되어 저장됩니다.` : '환율 정보가 없어 1달러=1원으로 처리됩니다. 대시보드에서 환율을 먼저 갱신해주세요.';
    } else { fxHint.classList.add('hidden'); }
  };
  curSel.onchange = updateFxHint;
  updateFxHint();
  document.getElementById('cf-submit').onclick = () => {
    const amount = +document.getElementById('cf-amount').value;
    const currency = curSel.value;
    const note = document.getElementById('cf-note').value.trim();
    if (!amount || amount<=0) { toast(`${mode==='deposit'?'입금':'출금'}액을 올바르게 입력해주세요.`, 'warn'); return; }
    const amountKRW = currency === 'USD' ? amount * (state.fx.rate||1) : amount;
    if (mode === 'withdraw') {
      if (amountKRW > balance + 0.5) { toast('현재 현금 잔고보다 큰 금액은 출금할 수 없어요.', 'warn'); return; }
      recordCashFlow('withdraw', -amountKRW, note, undefined, { currency, amount });
      toast('출금을 기록했습니다.', 'success');
    } else {
      recordCashFlow('deposit', amountKRW, note, undefined, { currency, amount });
      toast('입금을 기록했습니다.', 'success');
    }
    if (currentTab === 'dashboard') renderers.dashboard();
    if (currentTab === 'journal') renderJournalList();
    openCashFlowModal(mode);
  };
}

function renderJournalList() {
  const list = document.getElementById('journal-list');

  const cash = state.cashFlows.filter(c => c.type==='deposit' || c.type==='withdraw').map(c => ({ ...c, _kind:'cash' }));
  let items;
  if (journalViewMode === 'diary') items = diary;

  items = items.slice().sort((a,b) => a.date===b.date ? 0 : (a.date>b.date?1:-1)).reverse();

  if (journalHashtagFilter) items = items.filter(it => it._kind==='diary' && (it.hashtags||[]).includes(journalHashtagFilter));

      if (it._kind==='diary') return (it.title||'').toLowerCase().includes(q) || (it.content||'').toLowerCase().includes(q) || (it.hashtags||[]).some(t=>t.toLowerCase().includes(q));

      <p class="text-sm text-[#c6cbd9] whitespace-pre-wrap">${escapeHtml(it.content)}</p>
      ${(it.photos&&it.photos.length) ? `<div class="flex gap-2 mt-2.5 overflow-x-auto no-scrollbar">${it.photos.map(p=>`<img src="${p}" class="w-20 h-20 object-cover rounded-lg flex-shrink-0 journal-photo" data-src="${p}">`).join('')}</div>` : ''}
      ${(it.hashtags&&it.hashtags.length) ? `<div class="flex gap-1.5 flex-wrap mt-2.5">${it.hashtags.map(t=>`<span class="chip">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}

  `;
    if (it._kind === 'cash') return `
    <div class="card p-4">
      <div class="flex items-center justify-between mb-1">
        <p class="text-sm font-semibold">${it.date} (${weekdayKR(it.date)})</p>

function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => resolve(null);
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openJournalForm(existing) {
  let pendingPhotos = existing ? (existing.photos||[]).slice() : [];
  function renderPhotoPreview() {
    document.getElementById('jf-photo-preview').innerHTML = pendingPhotos.map((p,i)=>`

      <div><label class="text-xs text-muted mb-1 block">내용</label><textarea id="jf-content" placeholder="오늘 어떤 판단을 했고, 왜 그랬는지 적어보세요">${existing?escapeHtml(existing.content||''):''}</textarea></div>
      <div>

    </div>
  `, `
    <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm" onclick="closeModal()">취소</button>
    <button id="jf-save" class="btn-brand px-4 py-2.5 rounded-xl text-sm">저장</button>
  `);
  renderPhotoPreview();

    const files = [...e.target.files];
    let failed = 0;
    for (const f of files) {
      const compressed = await compressImage(f);

    }
    if (failed) toast(`${failed}개 파일은 이미지로 인식되지 않아 제외했습니다.`, 'warn');
    renderPhotoPreview();
    e.target.value = '';
  };

  document.getElementById('jf-save').onclick = () => {
    const date = document.getElementById('jf-date').value || todayStr();
    const mood = document.getElementById('jf-mood').value;
    const title = document.getElementById('jf-title').value.trim();
    const content = document.getElementById('jf-content').value.trim();
    const hashtags = document.getElementById('jf-tags').value.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
    if (!content) { toast('내용을 입력해주세요.', 'warn'); return; }
    if (existing) {
      Object.assign(existing, { date, mood, title, content, photos: pendingPhotos, hashtags });

    closeModal(); renderers.journal(); toast(existing ? '일지를 수정했습니다.' : '일지를 저장했습니다.', 'success');
  };
}

        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const token = session?.access_token;

          const res = await fetch('/delete-account', { method:'POST', headers:{ 'Authorization': `Bearer ${token}` } });
          const data = await res.json().catch(()=>({}));
          if (!res.ok) throw new Error(data.error || `삭제 실패 (${res.status})`);
          Object.values(LS).forEach(k => localStorage.removeItem(k));
          localStorage.removeItem('fomoguard_last_sync_date');
          localStorage.removeItem('fomoguard_demo_seed');
          localStorage.removeItem('fomoguard_onboarded');
          try { await supabaseClient.auth.signOut(); } catch (e) {}
          toast('회원탈퇴가 완료됐습니다.', 'success');

/* ================= TAB ORDER EDITOR ================= */
const TABORDER_ROW_H = 64, TABORDER_GAP = 8;
renderers.taborder = function() {
  const el = document.getElementById('panel-taborder');
  const order = state.settings.tabOrder;
  el.innerHTML = `
    <h2 class="font-bold text-xl mt-2 mb-1">🔀 탭 순서 편집</h2>
    <p class="text-xs text-muted mb-4">🧊 포모체크는 항상 하단 메뉴 정중앙에 고정됩니다. 오른쪽 손잡이(☰)를 눌러 끌면 순서를 바로 옮길 수 있어요. 위 3개가 하단 메뉴 자리에 표시돼요.</p>
    <div id="order-list" class="relative" style="height:${order.length*(TABORDER_ROW_H+TABORDER_GAP)-TABORDER_GAP}px"></div>
  `;
  function rowHtml(t, i) {
    return `
      <div class="row taborder-row p-3.5 flex items-center justify-between ${i<3?'':'opacity-60'}" data-tab-item="${t}" style="top:${i*(TABORDER_ROW_H+TABORDER_GAP)}px;height:${TABORDER_ROW_H}px">
        <div class="flex items-center gap-3">
          <span class="text-[10px] font-bold w-4 text-center order-num ${i<3?'text-brand':'text-muted'}">${i+1}</span>
          ${iconBadge(TAB_META[t].icon, TAB_META[t].color, 34)}
          <span class="text-sm font-semibold">${TAB_META[t].label}</span>
          <span class="badge bg-brand/15 text-brand order-badge ${i<3?'':'hidden'}">하단 메뉴</span>
        </div>
        <div class="drag-handle flex flex-col items-center justify-center" data-handle="${t}">
          <div class="drag-bar"></div><div class="drag-bar"></div><div class="drag-bar"></div>
        </div>
      </div>
    `;
  }
  function renderList() {
    document.getElementById('order-list').innerHTML = order.map((t,i) => rowHtml(t,i)).join('');
    attachHandlers();
  }
  function updateRowChrome() {
    order.forEach((t,i) => {
      const row = document.querySelector(`[data-tab-item="${t}"]`);
      if (!row) return;
      row.classList.toggle('opacity-60', i>=3);
      row.querySelector('.order-num').textContent = i+1;
      row.querySelector('.order-num').classList.toggle('text-brand', i<3);
      row.querySelector('.order-num').classList.toggle('text-muted', i>=3);
      row.querySelector('.order-badge').classList.toggle('hidden', i>=3);
    });
  }
  function attachHandlers() {
    document.querySelectorAll('[data-handle]').forEach(handle => {
      handle.onpointerdown = (e) => startDrag(e, handle.closest('.taborder-row'));
    });
  }
  let drag = null;
  function startDrag(e, row) {
    e.preventDefault();
    const tab = row.dataset.tabItem;
    const startIndex = order.indexOf(tab);
    drag = { row, tab, startIndex, currentIndex: startIndex, startY: e.clientY, startTop: startIndex*(TABORDER_ROW_H+TABORDER_GAP), pointerId: e.pointerId };
    row.setPointerCapture(e.pointerId);
    row.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
  }
  function onDragMove(e) {
    if (!drag) return;
    const delta = e.clientY - drag.startY;
    const maxTop = (order.length-1)*(TABORDER_ROW_H+TABORDER_GAP);
    const newTop = Math.min(Math.max(drag.startTop + delta, 0), maxTop);
    drag.row.style.top = newTop + 'px';
    const targetIndex = Math.round(newTop/(TABORDER_ROW_H+TABORDER_GAP));
    if (targetIndex !== drag.currentIndex) {
      order.splice(drag.currentIndex, 1);
      order.splice(targetIndex, 0, drag.tab);
      drag.currentIndex = targetIndex;
      order.forEach((t,i) => {
        if (t === drag.tab) return;
        const r = document.querySelector(`[data-tab-item="${t}"]`);
        if (r) r.style.top = i*(TABORDER_ROW_H+TABORDER_GAP) + 'px';
      });
      updateRowChrome();
    }
  }
  function onDragEnd(e) {
    if (!drag) return;
    drag.row.style.top = drag.currentIndex*(TABORDER_ROW_H+TABORDER_GAP) + 'px';
    drag.row.classList.remove('dragging');
    try { drag.row.releasePointerCapture(drag.pointerId); } catch(err) {}
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    if (drag.currentIndex !== drag.startIndex) {
      state.settings.tabOrder = order; save(LS.settings, state.settings);
      renderBottomNav();
    }
    drag = null;
  }
  renderList();
};

let dashEditMode = false;
let dashOrderLive = [];
let dashPress = null;
let dashDrag = null;

function dashSectionMeta(id) { return DASH_SECTIONS.find(s=>s.id===id); }
function dashSectionEls() { return Array.from(document.querySelectorAll('#dash-sections-wrap .dash-section')); }

function dashCumulativeTops(order, heights, gap) {
  const tops = {}; let acc = 0;
  order.forEach(id => { tops[id] = acc; acc += (heights[id]||0) + gap; });
  return { tops, total: Math.max(0, acc - gap) };
}
function dashMeasureHeights() {
  const heights = {};
  dashSectionEls().forEach(el => { heights[el.dataset.sectionId] = el.offsetHeight; });
  return heights;
}
function dashLayoutStatic() {
  const gap = 10;
  const heights = dashMeasureHeights();
  const { tops, total } = dashCumulativeTops(dashOrderLive, heights, gap);
  dashSectionEls().forEach(el => { el.style.top = tops[el.dataset.sectionId] + 'px'; });
  const wrap = document.getElementById('dash-sections-wrap');
  if (wrap) wrap.style.height = total + 'px';
  return { heights, gap };
}

function enterDashEditMode() {
  if (dashEditMode) return;
  dashEditMode = true;
  renderers.dashboard();
  toast('카드를 눌러서 옮기거나, 🗑을 눌러 숨겨보세요');
}
function exitDashEditMode() {
  dashEditMode = false;
  renderers.dashboard();
}
function dashTrashSection(id) {
  const idx = dashOrderLive.indexOf(id);
  if (idx >= 0) dashOrderLive.splice(idx, 1);
  if (!state.settings.dashboardHidden.includes(id)) state.settings.dashboardHidden.push(id);
  state.settings.dashboardOrder = dashOrderLive.concat(state.settings.dashboardHidden);
  save(LS.settings, state.settings);
  renderers.dashboard();
}
function dashRestoreSection(id) {
  const idx = state.settings.dashboardHidden.indexOf(id);
  if (idx >= 0) state.settings.dashboardHidden.splice(idx, 1);
  if (!dashOrderLive.includes(id)) dashOrderLive.push(id);
  state.settings.dashboardOrder = dashOrderLive.concat(state.settings.dashboardHidden);
  save(LS.settings, state.settings);
  renderers.dashboard();
}

function attachDashPressHandlers() {
  dashSectionEls().forEach(sec => {
    if (dashEditMode) {
      // 편집 모드에서는 오른쪽 손잡이만 드래그를 시작함 - 카드 나머지 부분은 평소처럼 스크롤 가능
      const handle = sec.querySelector('[data-dash-handle]');
      if (handle) handle.onpointerdown = (e) => startDashDrag(e, sec);
      return;
    }
    sec.onpointerdown = (e) => {
      const startXY = { x: e.clientX, y: e.clientY };
      const onMove = (ev) => {
        if (Math.abs(ev.clientX-startXY.x) > 10 || Math.abs(ev.clientY-startXY.y) > 10) cancelPress();
      };
      const cancelPress = () => {
        if (dashPress && dashPress.timer) clearTimeout(dashPress.timer);
        dashPress = null;
        sec.removeEventListener('pointermove', onMove);
        sec.removeEventListener('pointerup', cancelPress);
        sec.removeEventListener('pointercancel', cancelPress);
      };
      const timer = setTimeout(() => { dashPress = null; enterDashEditMode(); }, 2000);
      dashPress = { timer };
      sec.addEventListener('pointermove', onMove);
      sec.addEventListener('pointerup', cancelPress, { once:true });
      sec.addEventListener('pointercancel', cancelPress, { once:true });
    };
  });
}

function startDashDrag(e, sec) {
  e.preventDefault();
  const id = sec.dataset.sectionId;
  const { heights, gap } = dashLayoutStatic();
  const startTop = parseFloat(sec.style.top || '0');
  dashDrag = { sec, id, heights, gap, startY: e.clientY, startTop };
  sec.setPointerCapture(e.pointerId);
  dashDrag.pointerId = e.pointerId;
  sec.classList.add('dash-dragging');
  document.addEventListener('pointermove', onDashDragMove);
  document.addEventListener('pointerup', onDashDragEnd);
}
function onDashDragMove(e) {
  if (!dashDrag) return;
  const { sec, id, heights, gap } = dashDrag;
  const newTop = dashDrag.startTop + (e.clientY - dashDrag.startY);
  sec.style.top = newTop + 'px';
  const draggedCenter = newTop + heights[id]/2;
  const others = dashOrderLive.filter(x => x !== id);
  const { tops: otherTops } = dashCumulativeTops(others, heights, gap);
  let targetIndex = others.length;
  for (let i = 0; i < others.length; i++) {
    const otherCenter = otherTops[others[i]] + heights[others[i]]/2;
    if (draggedCenter < otherCenter) { targetIndex = i; break; }
  }
  const newOrder = others.slice();
  newOrder.splice(targetIndex, 0, id);
  if (newOrder.join(',') !== dashOrderLive.join(',')) {
    dashOrderLive = newOrder;
    const { tops } = dashCumulativeTops(dashOrderLive, heights, gap);
    dashSectionEls().forEach(el => {
      if (el.dataset.sectionId === id) return;
      el.style.top = tops[el.dataset.sectionId] + 'px';
    });
  }
}
function onDashDragEnd(e) {
  if (!dashDrag) return;
  const { sec, id, heights, gap, pointerId } = dashDrag;
  const { tops } = dashCumulativeTops(dashOrderLive, heights, gap);
  sec.classList.remove('dash-dragging');
  sec.style.top = tops[id] + 'px';
  try { sec.releasePointerCapture(pointerId); } catch(err) {}
  document.removeEventListener('pointermove', onDashDragMove);
  document.removeEventListener('pointerup', onDashDragEnd);
  state.settings.dashboardOrder = dashOrderLive.concat(state.settings.dashboardHidden);
  save(LS.settings, state.settings);
  dashDrag = null;
}

/* ---------------- init ---------------- */
async function init() {
  snapshotToday();
  grantDailyLoginXp();
  renderHeaderProfile();
  await initSupabaseAuth();
  if (!state.profile && !localStorage.getItem('fomoguard_onboarded')) {
    showWelcomeOverlay();
  } else {
    maybeShowTutorial();
  }
  if (localStorage.getItem('fomoguard_last_sync_date') !== todayStr()) {
    await refreshMarketData(false);
  }
  switchTab('dashboard');
}
init();
</script>
