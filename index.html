<script>
/* ---------------- storage ---------------- */
const LS = {
  principles: 'fomoguard_principles',
  portfolio: 'fomoguard_portfolio',
  journal: 'fomoguard_journal',
  transactions: 'fomoguard_transactions',
  factchecks: 'fomoguard_factchecks',
  snapshots: 'fomoguard_snapshots',
  settings: 'fomoguard_settings',
  fx: 'fomoguard_fx',
  market: 'fomoguard_market',
  dailyAnalysis: 'fomoguard_daily_analysis',
  newsKeywords: 'fomoguard_news_keywords',
  newsCache: 'fomoguard_news_cache',
  profile: 'fomoguard_profile',
  cashFlows: 'fomoguard_cash_flows'
};
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); if (typeof SYNCABLE_KEYS !== 'undefined' && SYNCABLE_KEYS.has(key)) scheduleCloudSync(); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));

const CENTER_TAB = 'factcheck';
const REORDERABLE = ['dashboard','portfolio','journal','principles','settings','news'];

/* ================= AI PROVIDERS (멀티 AI 연동 + 키 자동인식) ================= */
const AI_PROVIDERS = {
  claude: { label:'Claude', keyPlaceholder:'sk-ant-...', defaultModel:'claude-sonnet-5', modelSuggestions:['claude-sonnet-5','claude-opus-5','claude-haiku-4-5-20251001'] },
  gemini: { label:'Gemini', keyPlaceholder:'AIza...', defaultModel:'gemini-3.6-flash', modelSuggestions:['gemini-3.6-flash','gemini-2.5-flash','gemini-3.1-pro-preview'] },
  openai: { label:'ChatGPT', keyPlaceholder:'sk-...', defaultModel:'gpt-4.1', modelSuggestions:['gpt-5','gpt-4.1','gpt-4o-mini'] },
  grok: { label:'Grok', keyPlaceholder:'xai-...', defaultModel:'grok-4', modelSuggestions:['grok-4','grok-3'] }
};
function detectProviderFromKey(key) {
  if (/^sk-ant-/.test(key)) return 'claude';
  if (/^AIza/.test(key)) return 'gemini';
  if (/^xai-/.test(key)) return 'grok';
  if (/^sk-/.test(key)) return 'openai';
  return null;
}
function isLikelyChatModel(id, provider) {
  if (provider !== 'openai' && provider !== 'grok') return true;
  const bad = ['embedding','whisper','tts','dall-e','moderation','babbage','davinci-002','image','audio','realtime'];
  const lower = id.toLowerCase();
  return !bad.some(b => lower.includes(b));
}
async function fetchModelList(provider, key) {
  try {
    if (provider === 'claude') {
      const res = await fetch('https://api.anthropic.com/v1/models', { headers: { 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' } });
      if (!res.ok) return null;
      const data = await res.json();
      return (data.data||[]).map(m=>m.id);
    }
    if (provider === 'gemini') {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      if (!res.ok) return null;
      const data = await res.json();
      return (data.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent')).map(m => m.name.replace('models/',''));
    }
    const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/models' : 'https://api.x.ai/v1/models';
    const res = await fetch(endpoint, { headers: { 'Authorization':`Bearer ${key}` } });
    if (!res.ok) return null;
    const data = await res.json();
    return (data.data||[]).map(m=>m.id).filter(id => isLikelyChatModel(id, provider)).sort();
  } catch(e) { return null; }
}
let modelListCache = { claude:[], gemini:[], openai:[], grok:[] };

let state = {
  principles: load(LS.principles, []),
  portfolio: load(LS.portfolio, []),
  journal: load(LS.journal, []),
  transactions: load(LS.transactions, []),
  factchecks: load(LS.factchecks, []),
  snapshots: load(LS.snapshots, []),
  fx: load(LS.fx, { rate: null, updatedAt: null }),
  marketSnapshot: load(LS.market, null),
  dailyAnalysis: load(LS.dailyAnalysis, null),
  newsKeywords: load(LS.newsKeywords, []),
  newsCache: load(LS.newsCache, {}),
  cashFlows: load(LS.cashFlows, []),
  profile: load(LS.profile, null),
  settings: load(LS.settings, { provider:'claude', apiKeys:{claude:'',gemini:'',openai:'',grok:''}, models:{claude:'claude-sonnet-5',gemini:'gemini-3.6-flash',openai:'gpt-4.1',grok:'grok-4'}, twelveDataKey:'', newsApiKey:'', tabOrder: REORDERABLE.slice() })
};
function sanitizeSettings() {
  let order = (state.settings.tabOrder || []).filter(t => REORDERABLE.includes(t));
  REORDERABLE.forEach(t => { if (!order.includes(t)) order.push(t); });
  state.settings.tabOrder = order;
  if (!state.settings.apiKeys) state.settings.apiKeys = { claude: state.settings.apiKey || '', gemini:'', openai:'', grok:'' };
  if (!state.settings.models) state.settings.models = { claude: state.settings.model || 'claude-sonnet-5', gemini:'gemini-3.6-flash', openai:'gpt-4.1', grok:'grok-4' };
  if (!state.settings.provider) state.settings.provider = 'claude';
  if (state.settings.newsApiKey === undefined) state.settings.newsApiKey = state.settings.marketauxKey || '';
  if (state.settings.twelveDataKey === undefined) state.settings.twelveDataKey = '';
}
sanitizeSettings();
function hasApiKey() { return !!(state.settings.apiKeys||{})[state.settings.provider]; }
function canUseAI() { return hasApiKey() || !!currentUser; }

const FREE_AI_DAILY_CAP = 3;
async function callFreeAI({ system, user, maxTokens=1024 }) {
  if (!supabaseClient || !currentUser) throw new Error('무료 AI를 쓰려면 먼저 Google 로그인을 해주세요. (또는 설정에서 본인 API 키를 등록하면 로그인 없이도 무제한으로 이용 가능해요)');
  const { data: { session } } = await supabaseClient.auth.getSession();
  const token = session?.access_token;
  if (!token) throw new Error('로그인 세션이 만료되었어요. 다시 로그인해주세요.');
  let res;
  try {
    res = await fetch('/ai-free', {
      method: 'POST',
      headers: { 'content-type':'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ system, user, maxTokens })
    });
  } catch (e) {
    throw new Error('무료 AI 서버에 연결하지 못했습니다. 잠시 후 다시 시도하거나, 설정에서 본인 API 키를 등록해보세요.');
  }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || `무료 AI 오류 (${res.status})`);
  return data.text || '';
}

async function callAI({ system, user, maxTokens=1024 }) {
  if (!hasApiKey()) return callFreeAI({ system, user, maxTokens });
  const provider = state.settings.provider || 'claude';
  const apiKey = (state.settings.apiKeys||{})[provider];
  const model = (state.settings.models||{})[provider] || AI_PROVIDERS[provider].defaultModel;

  if (provider === 'claude') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model, max_tokens:maxTokens, system, messages:[{ role:'user', content:user }] })
    });
    if (!res.ok) throw new Error(`Claude API 오류 (${res.status}): ${(await res.text()).slice(0,200)}`);
    const data = await res.json();
    return data.content?.[0]?.text || '';
  }
  if (provider === 'gemini') {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST', headers: { 'content-type':'application/json' },
      body: JSON.stringify({ system_instruction:{ parts:[{ text:system }] }, contents:[{ role:'user', parts:[{ text:user }] }], generationConfig:{ maxOutputTokens:maxTokens } })
    });
    if (!res.ok) throw new Error(`Gemini API 오류 (${res.status}): ${(await res.text()).slice(0,200)}`);
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  }
  const endpoint = provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.x.ai/v1/chat/completions';
  const res = await fetch(endpoint, {
    method: 'POST', headers: { 'content-type':'application/json', 'Authorization':`Bearer ${apiKey}` },
    body: JSON.stringify({ model, max_tokens:maxTokens, messages:[{ role:'system', content:system },{ role:'user', content:user }] })
  });
  if (!res.ok) throw new Error(`${AI_PROVIDERS[provider].label} API 오류 (${res.status}): ${(await res.text()).slice(0,200)}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

/* ---------------- toast ---------------- */
function toast(msg, type='info') {
  const colors = { info:'#3182f6', success:'#00c896', error:'#f04452', warn:'#ffb800' };
  const el = document.createElement('div');
  el.className = 'card px-4 py-3 text-sm shadow-lg fade-in max-w-full w-full';
  el.style.borderLeft = `4px solid ${colors[type]||colors.info}`;
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ---------------- 클라우드 동기화 (Supabase Auth + DB) ---------------- */
/* 아래 두 값을 본인의 Supabase 프로젝트 값으로 교체하세요. (설정 가이드 참고) */
const SUPABASE_URL = 'https://ynxnouerpxxemntddqya.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4raTyA00kKvm_rSveM336w_uncSPaNA';
function isSupabaseConfigured() { return !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON'); }
let supabaseClient = null;
let currentUser = null;
const SYNCABLE_KEYS = new Set([LS.principles, LS.portfolio, LS.journal, LS.transactions, LS.factchecks, LS.snapshots, LS.newsKeywords, LS.cashFlows, LS.settings]);
let cloudSyncTimer = null;
function scheduleCloudSync() {
  if (!supabaseClient || !currentUser) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(pushToCloud, 1500);
}
async function pushToCloud() {
  if (!supabaseClient || !currentUser) return;
  const payload = { principles: state.principles, portfolio: state.portfolio, journal: state.journal, transactions: state.transactions, factchecks: state.factchecks, snapshots: state.snapshots, newsKeywords: state.newsKeywords, cashFlows: state.cashFlows, settings: state.settings };
  const { error } = await supabaseClient.from('fomoguard_data').upsert({ user_id: currentUser.id, data: payload, updated_at: new Date().toISOString() });
  if (!error) localStorage.setItem('fomoguard_last_cloud_sync', String(Date.now()));
}
async function pullFromCloud() {
  if (!supabaseClient || !currentUser) return;
  const { data } = await supabaseClient.from('fomoguard_data').select('data').eq('user_id', currentUser.id).maybeSingle();
  if (data && data.data && Object.keys(data.data).length) {
    const d = data.data;
    if (d.principles) { state.principles = d.principles; save(LS.principles, state.principles); }
    if (d.portfolio) { state.portfolio = d.portfolio; save(LS.portfolio, state.portfolio); }
    if (d.journal) { state.journal = d.journal; save(LS.journal, state.journal); }
    if (d.transactions) { state.transactions = d.transactions; save(LS.transactions, state.transactions); }
    if (d.factchecks) { state.factchecks = d.factchecks; save(LS.factchecks, state.factchecks); }
    if (d.snapshots) { state.snapshots = d.snapshots; save(LS.snapshots, state.snapshots); }
    if (d.newsKeywords) { state.newsKeywords = d.newsKeywords; save(LS.newsKeywords, state.newsKeywords); }
    if (d.cashFlows) { state.cashFlows = d.cashFlows; save(LS.cashFlows, state.cashFlows); }
    if (d.settings) { state.settings = d.settings; sanitizeSettings(); save(LS.settings, state.settings); }
    localStorage.setItem('fomoguard_last_cloud_sync', String(Date.now()));
    if (renderers[currentTab]) renderers[currentTab]();
  } else {
    await pushToCloud();
  }
}
async function handleSupabaseSession(session, isNewSignIn) {
  currentUser = session.user;
  const meta = session.user.user_metadata || {};
  state.profile = { provider:'google', name: meta.full_name || meta.name || '회원', email: session.user.email||'', picture: meta.avatar_url || meta.picture || '' };
  save(LS.profile, state.profile);
  renderHeaderProfile();
  await pullFromCloud();
  if (isNewSignIn) { hideWelcomeOverlay(); showWelcomeGreeting(state.profile.name); }
  if (currentTab === 'settings') renderers.settings();
}
async function initSupabaseAuth() {
  if (!isSupabaseConfigured()) return;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) await handleSupabaseSession(session, false);
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session && (!currentUser || currentUser.id !== session.user.id)) {
        handleSupabaseSession(session, true);
      } else if (event === 'SIGNED_OUT') {
        currentUser = null; state.profile = null; localStorage.removeItem(LS.profile);
        renderHeaderProfile();
        if (currentTab === 'settings') renderers.settings();
      }
    });
  } catch(e) {}
}
async function loginWithGoogle() {
  if (!isSupabaseConfigured()) { toast('클라우드 로그인이 아직 설정되지 않았어요. 설정 가이드를 참고해 SUPABASE_URL/ANON_KEY를 등록해주세요.', 'warn'); return; }
  await supabaseClient.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin + window.location.pathname } });
}
function renderGoogleButton(targetId) {
  const btnEl = document.getElementById(targetId);
  if (!btnEl) return;

function renderBottomNav() {
  const nav = document.getElementById('bottom-nav');

  function normalBtn(t) {
    return `<button data-tab="${t}" class="navbtn flex-1 flex flex-col items-center gap-0.5 py-1 ${currentTab===t?'active':''}">

      <button data-tab="${CENTER_TAB}" class="navbtn-center ${centerActive?'ring-2 ring-white/50':''}">${TAB_META[CENTER_TAB].icon}</button>
      <span class="text-[10px] font-bold mt-7 ${centerActive?'text-brand':'text-[#c6cbd9]'}">${TAB_META[CENTER_TAB].label}</span>
    </div>
  `;

    <button data-tab="more" class="navbtn flex-1 flex flex-col items-center gap-0.5 py-1.5 ${!isMainVisible?'active':''}">
      <span class="text-xl leading-none">☰</span>
      <span class="text-[10px] font-semibold">더보기</span>

  `;

function renderHeaderState() {
  document.getElementById('btn-back').classList.toggle('hidden', navHistory.length === 0);
  document.getElementById('btn-back').classList.toggle('flex', navHistory.length > 0);
}

function switchTab(name, isBack) {
  if (!isBack && currentTab && currentTab !== name) navHistory.push(currentTab);
  currentTab = name;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  const panel = document.getElementById('panel-' + name);
  panel.classList.remove('hidden');
  panel.classList.add('fade-in');
  window.scrollTo(0,0);
  if (renderers[name]) renderers[name]();
  renderBottomNav();
  renderHeaderState();
}
function goBack() {
  if (navHistory.length === 0) return;
  const prev = navHistory.pop();
  switchTab(prev, true);
}
function goHome() {
  switchTab('dashboard');
  navHistory = [];
  renderHeaderState();
}
document.getElementById('btn-back').addEventListener('click', goBack);

/* ---------------- helpers ---------------- */
const fmtWon = n => (Math.round(n)||0).toLocaleString('ko-KR') + '원';
const fmtPct = n => (n>0?'+':'') + n.toFixed(1) + '%';
const fmtPrice = (n, currency) => currency==='USD' ? '$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : fmtWon(n);
const todayStr = () => new Date().toISOString().slice(0,10);
function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(u||'') ? u : '#'; }
function timeAgo(ts) {
  if (!ts) return '정보 없음';
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if (min < 1) return '방금 전';
  if (min < 60) return `${min}분 전`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `${hr}시간 전`;
  return `${Math.floor(hr/24)}일 전`;
}
function daysAgoLabel(dateStr) {
  const t = Date.parse(dateStr);
  if (isNaN(t)) return '';
  const days = Math.floor((Date.now()-t)/86400000);
  if (days <= 0) return '오늘';
  if (days === 1) return '어제';
  if (days < 7) return `${days}일 전`;
  return new Date(t).toISOString().slice(0,10);
}
function weekdayKR(dateStr) { const d = new Date(dateStr+'T00:00:00'); return ['일','월','화','수','목','금','토'][d.getDay()]; }
function retColor(ret) {
  if (ret > 15) return '#c81e2c';
  if (ret > 5) return '#e34350';
  if (ret > 0) return '#f2828c';
  if (ret === 0) return '#3a4152';
  if (ret > -5) return '#7fb0fb';
  if (ret > -15) return '#4f8bf5';
  return '#2563d9';
}
function quoteOfTheDay() {
  const pool = [...MARKET_QUOTES, ...MEME_QUOTES];
  return pool[Math.floor(Math.random()*pool.length)];
}

    if (step < COMPASS_QUESTIONS.length) {
      const q = COMPASS_QUESTIONS[step];
      openModal(`🧭 투자 나침반 (${step+1}/${COMPASS_QUESTIONS.length})`, `
        <p class="text-sm font-semibold mb-4">${escapeHtml(q.q)}</p>

      const meta = COMPASS_RESULT_META[best];
      const cat = INVESTOR_CATEGORIES[meta.catIndex];
      openModal('🧭 나의 투자 나침반 결과', `
        <div class="text-center mb-4"><span class="text-4xl">${meta.emoji}</span><p class="font-bold text-lg mt-2">${meta.title}</p><p class="text-xs text-muted mt-1">${meta.desc}</p></div>
        <div class="row p-3.5 mb-3"><p class="text-xs font-semibold text-brand mb-1">추천 카테고리 · ${cat.category}</p><p class="text-[11px] text-muted">${cat.desc}</p></div>

        <label class="row p-3 flex items-center gap-2.5 mb-2"><input type="checkbox" id="compass-add-summary" checked><span class="text-xs">나의 투자 나침반 결과 요약 추가</span></label>
        ${cat.investors.map((t,i)=>`<label class="row p-3 flex items-center gap-2.5 mb-2"><input type="checkbox" class="compass-add-investor" data-ii="${i}" checked><span class="text-xs">${t.name}의 원칙 추가</span></label>`).join('')}
      `, `
        <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm" onclick="closeModal()">닫기</button>
        <button id="compass-finish" class="btn-brand px-4 py-2.5 rounded-xl text-sm">선택 항목 추가</button>
      `);
      document.getElementById('compass-finish').onclick = () => {

        if (document.getElementById('compass-add-summary').checked) {

          state.principles.push({ id: uid(), title:'나의 투자 나침반 결과', body:`추천 유형: ${meta.title}\n${meta.desc}\n\n[답변 요약]\n${answerLabels.map(l=>'· '+l).join('\n')}`, source:'투자 나침반 테스트', createdAt: Date.now() });

          count++;

        closeModal(); renderers.principles(); toast(`${count}개 원칙을 추가했습니다.`, 'success');
      };
    }
  }
  renderStep();
}

/* ================= PORTFOLIO / FX MATH ================= */
function holdingKRW(h) {
  const rate = state.fx.rate || 1;
  const factor = h.currency==='USD' ? rate : 1;
  return { value: h.quantity*h.currentPrice*factor, cost: h.quantity*h.avgPrice*factor };
}
function computePortfolioStats() {
  let totalValue=0, totalCost=0, coreValue=0, satValue=0, coreCost=0, satCost=0;
  state.portfolio.forEach(h => {
    const { value, cost } = holdingKRW(h);
    totalValue += value; totalCost += cost;
    if (h.type === 'core') { coreValue += value; coreCost += cost; } else { satValue += value; satCost += cost; }
  });
  const returnPct = totalCost>0 ? (totalValue-totalCost)/totalCost*100 : 0;
  const coreReturnPct = coreCost>0 ? (coreValue-coreCost)/coreCost*100 : 0;
  const satReturnPct = satCost>0 ? (satValue-satCost)/satCost*100 : 0;
  return { totalValue, totalCost, coreValue, satValue, coreCost, satCost, returnPct, coreReturnPct, satReturnPct };
}
function realizedSummary() {
  let pnl=0, costBasis=0;
  state.transactions.filter(t=>t.type==='sell').forEach(t => {
    const factor = t.currency==='USD' ? (state.fx.rate||1) : 1;
    pnl += t.realizedPnL*factor;
    costBasis += t.avgPriceAtTime*t.quantity*factor;
  });
  return { pnl, costBasis };
}
function computeCashBalance() { return state.cashFlows.reduce((s,c)=>s+c.amountKRW, 0); }
function recordCashFlow(type, amountKRW, note, date, origin) {
  state.cashFlows.push({ id: uid(), date: date || todayStr(), ts: Date.now(), type, amountKRW, note: note || '', currency: (origin&&origin.currency)||'KRW', originalAmount: origin?origin.amount:undefined });
  save(LS.cashFlows, state.cashFlows);
}
function computeTotalPnl() {
  const { totalValue, totalCost } = computePortfolioStats();
  const realized = realizedSummary();
  const unrealizedPnl = totalValue - totalCost;
  const totalPnl = unrealizedPnl + realized.pnl;
  const totalDeployedCost = totalCost + realized.costBasis;
  const totalPnlPct = totalDeployedCost>0 ? totalPnl/totalDeployedCost*100 : 0;
  return { unrealizedPnl, realizedPnl: realized.pnl, totalPnl, totalDeployedCost, totalPnlPct };
}
function holdingRealizedPnL(holdingId) {
  let sum = 0;
  state.transactions.filter(t=>t.type==='sell' && t.holdingId===holdingId).forEach(t => {
    const factor = t.currency==='USD' ? (state.fx.rate||1) : 1;
    sum += t.realizedPnL*factor;
  });
  return sum;
}
function closedPositionsSummary() {
  const openIds = new Set(state.portfolio.map(h=>h.id));
  const map = {};
  state.transactions.filter(t=>t.type==='sell' && !openIds.has(t.holdingId)).forEach(t => {
    const factor = t.currency==='USD' ? (state.fx.rate||1) : 1;
    if (!map[t.holdingId]) map[t.holdingId] = { name:t.name, profit:0 };
    map[t.holdingId].profit += t.realizedPnL*factor;
  });
  return Object.values(map);
}
function snapshotToday() {
  const { totalValue, totalCost } = computePortfolioStats();
  const idx = state.snapshots.findIndex(s => s.date === todayStr());
  const entry = { date: todayStr(), totalValue, totalCost };
  if (idx >= 0) state.snapshots[idx] = entry; else state.snapshots.push(entry);
  state.snapshots.sort((a,b)=> a.date.localeCompare(b.date));
  save(LS.snapshots, state.snapshots);
}

/* ================= MARKET DATA SYNC (시세 · 환율 · 지수) ================= */
async function fetchFxRate() {
  try {
    if (state.settings.twelveDataKey) {
      const res = await fetch(`https://api.twelvedata.com/price?symbol=USD/KRW&apikey=${encodeURIComponent(state.settings.twelveDataKey)}`);
      const data = await res.json();
      if (data.price && !isNaN(+data.price)) { state.fx = { rate:+data.price, updatedAt:Date.now() }; save(LS.fx, state.fx); return true; }
    }
    const res2 = await fetch('https://open.er-api.com/v6/latest/USD');
    const data2 = await res2.json();
    if (data2.rates && data2.rates.KRW) { state.fx = { rate:+data2.rates.KRW, updatedAt:Date.now() }; save(LS.fx, state.fx); return true; }
  } catch(e) {}
  return false;
}
async function syncStockPrices() {
  const key = state.settings.twelveDataKey;
  if (!key) return { ok:0, fail:0, skipped:true };
  const withTicker = state.portfolio.filter(h=>h.ticker);
  if (!withTicker.length) return { ok:0, fail:0, skipped:false };
  const groups = {};
  withTicker.forEach(h => { const ex = h.exchange||''; (groups[ex]=groups[ex]||[]).push(h); });
  let ok=0, fail=0;
  for (const ex of Object.keys(groups)) {
    const hs = groups[ex];
    const symbols = [...new Set(hs.map(h=>h.ticker))].join(',');
    let url = `https://api.twelvedata.com/price?symbol=${encodeURIComponent(symbols)}&apikey=${encodeURIComponent(key)}`;
    if (ex) url += `&exchange=${encodeURIComponent(ex)}`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      hs.forEach(h => {
        let priceStr;
        if (data.price !== undefined) priceStr = data.price;
        else if (data[h.ticker] && data[h.ticker].price !== undefined) priceStr = data[h.ticker].price;
        if (priceStr && !isNaN(+priceStr)) { h.currentPrice = +priceStr; h.priceUpdatedAt = Date.now(); ok++; }
        else fail++;
      });
    } catch(e) { fail += hs.length; }
    await new Promise(r=>setTimeout(r, 800));
  }
  save(LS.portfolio, state.portfolio);
  return { ok, fail, skipped:false };
}
async function fetchMarketSnapshot() {
  const key = state.settings.twelveDataKey;
  if (!key) return null;
  const symbols = [
    { label:'코스피', symbol:'KOSPI', exchange:'KRX' },
    { label:'S&P500(SPY)', symbol:'SPY', exchange:'' },
    { label:'나스닥(QQQ)', symbol:'QQQ', exchange:'' }
  ];
  const items = [];
  for (const s of symbols) {
    let url = `https://api.twelvedata.com/quote?symbol=${encodeURIComponent(s.symbol)}&apikey=${encodeURIComponent(key)}`;
    if (s.exchange) url += `&exchange=${encodeURIComponent(s.exchange)}`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.close) items.push({ label:s.label, close:+data.close, pct:+(data.percent_change||0) });
    } catch(e) {}
    await new Promise(r=>setTimeout(r, 600));
  }
  if (items.length) { state.marketSnapshot = { date: todayStr(), items }; save(LS.market, state.marketSnapshot); }
  return items;
}

/* ================= 실시간 뉴스 (관심 키워드, GNews 기반 헤드라인+요약) ================= */
/* GNews 무료 플랜은 브라우저 직접 호출(CORS)이 localhost로 제한되어 있어, 배포된 도메인에서는
   서버 프록시(/news-proxy, Cloudflare Pages Functions)를 거쳐 호출한다.
   프록시는 한글 키워드일 경우 영문으로 번역해 해외 뉴스까지 함께 검색하고,
   비한국어 기사는 제목·요약을 한국어로 번역해서 돌려준다. */
async function fetchNewsForKeyword(keyword) {
  const key = state.settings.newsApiKey;
  if (!key) throw new Error('뉴스 API 키가 등록되어 있지 않습니다.');
  const fromDate = new Date(Date.now() - 3*86400000).toISOString();
  let res;
  try {
    res = await fetch('/news-proxy', {
      method: 'POST',
      headers: { 'content-type':'application/json' },
      body: JSON.stringify({ keyword, apiKey:key, fromDate, max:10 })
    });
  } catch (e) {
    throw new Error('뉴스 서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.');
  }
  if (!res.ok) { const t = await res.text(); let msg; try { msg = JSON.parse(t).error; } catch(e) { msg = t; } throw new Error(msg || `뉴스 API 오류 (${res.status})`); }
  const data = await res.json();
  if (!Array.isArray(data.articles)) throw new Error('GNews 응답 형식이 예상과 다릅니다: ' + JSON.stringify(data).slice(0,200));
  let items = data.articles.map(a => ({ title:a.titleKo||a.title||'', url:a.url||'#', source:a.source?.name||'', publishedAt:a.publishedAt||'', description:a.descriptionKo||a.description||'', translated:!!a.translated }));
  const cutoff = Date.now() - 3*86400000;
  items = items.filter(it => { const t = Date.parse(it.publishedAt); return !isNaN(t) && t >= cutoff; });
  items.sort((a,b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));
  items = items.slice(0, 8);
  items.totalFound = data.totalArticles ?? data.articles.length;
  state.newsCache[keyword] = { date: todayStr(), items, totalFound: items.totalFound };
  save(LS.newsCache, state.newsCache);
  return items;
}
async function fetchAllNewsKeywords() {
  if (!state.settings.newsApiKey || !state.newsKeywords.length) return;
  for (const k of state.newsKeywords) {
    const cached = state.newsCache[k];
    if (cached && cached.date === todayStr()) continue;
    try { await fetchNewsForKeyword(k); } catch(e) {}
    await new Promise(r=>setTimeout(r, 400));
  }
}

async function loadKeywordNews(keyword, forceRefresh) {
  const idx = state.newsKeywords.indexOf(keyword);
  if (idx === -1) return;
  const blockEl = document.getElementById('news-block-'+idx);
  if (!blockEl) return;
  const cached = state.newsCache[keyword];
  if (!forceRefresh && cached && cached.date === todayStr()) {
    if (cached.items.length === 0) { blockEl.innerHTML = `<p class="text-xs text-muted">최근 3일 내 관련 뉴스가 없습니다.${cached.totalFound ? ` (GNews 전체 검색결과 ${cached.totalFound}건 중 3일 이내 0건 — 기간을 벗어난 오래된 기사만 있는 것으로 보여요)` : ''}</p>`; return; }
    renderNewsItems(blockEl, cached.items);
    return;
  }
  if (!state.settings.newsApiKey) { blockEl.innerHTML = `<p class="text-xs text-muted">뉴스 API 키를 등록하면 이 키워드의 최신 뉴스를 볼 수 있어요.</p>`; return; }
  blockEl.innerHTML = `<p class="text-xs text-muted"><span class="inline-block spin">⏳</span> 최신 뉴스를 불러오는 중...</p>`;
  try {
    const items = await fetchNewsForKeyword(keyword);
    if (items.length === 0) {
      blockEl.innerHTML = `<p class="text-xs text-muted">최근 3일 내 관련 뉴스가 없습니다.${items.totalFound ? ` (GNews 전체 검색결과 ${items.totalFound}건 중 3일 이내 0건 — 기간을 벗어난 오래된 기사만 있는 것으로 보여요)` : ' (GNews에서 이 키워드로 검색된 기사가 아예 없습니다 — 다른 키워드를 시도해보세요)'}</p>`;
      return;
    }
    renderNewsItems(blockEl, items);
  } catch (err) {
    blockEl.innerHTML = `<p class="text-xs text-bad">뉴스를 불러오지 못했습니다: ${escapeHtml(err.message)}</p>`;
  }
}
function renderNewsItems(blockEl, items) {
  blockEl.innerHTML = items.map(a => `
    <a href="${escapeHtml(safeUrl(a.url))}" target="_blank" rel="noopener" class="row p-3.5 block">
      <p class="text-sm font-semibold leading-snug">${escapeHtml(a.title)}</p>
      ${a.description ? `<p class="text-xs text-muted mt-1 line-clamp-2">${escapeHtml(a.description.slice(0,120))}</p>` : ''}
      <p class="text-[10px] text-muted mt-1.5">${escapeHtml(a.source)}${a.translated ? ' · 🌐 번역' : ''} · ${daysAgoLabel(a.publishedAt)}</p>
    </a>
  `).join('');
}

/* ================= TREEMAP (squarify) ================= */
function squarify(items, x, y, w, h) {
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const areaTotal = Math.max(w*h, 1);
  const scaled = items.map(i => ({ ...i, area: i.value/total*areaTotal })).sort((a,b)=>b.area-a.area);
  const rects = [];
  function worst(row, length) {
    if (!row.length) return Infinity;
    const sum = row.reduce((a,b)=>a+b.area,0);
    let rmax=-Infinity, rmin=Infinity;
    row.forEach(r => { if (r.area>rmax) rmax=r.area; if (r.area<rmin) rmin=r.area; });
    return Math.max((length*length*rmax)/(sum*sum), (sum*sum)/(length*length*rmin));
  }
  function layoutRow(row, x, y, w, h) {
    const sum = row.reduce((a,b)=>a+b.area,0);
    const out = [];
    if (w >= h) {
      const stripW = sum / h;
      let cy = y;
      row.forEach(it => { const rh = it.area/stripW; out.push({ ...it, rx:x, ry:cy, rw:stripW, rh }); cy += rh; });
      return { out, nx:x+stripW, ny:y, nw:w-stripW, nh:h };
    } else {
      const stripH = sum / w;
      let cx = x;
      row.forEach(it => { const rw = it.area/stripH; out.push({ ...it, rx:cx, ry:y, rw, rh:stripH }); cx += rw; });
      return { out, nx:x, ny:y+stripH, nw:w, nh:h-stripH };
    }
  }
  function recurse(remaining, row, x, y, w, h) {
    if (!remaining.length) { if (row.length) { const { out } = layoutRow(row,x,y,w,h); rects.push(...out); } return; }
    const length = Math.min(w,h);
    const next = remaining[0];
    const newRow = row.concat([next]);
    if (!row.length || worst(row,length) >= worst(newRow,length)) {
      recurse(remaining.slice(1), newRow, x, y, w, h);
    } else {
      const { out, nx, ny, nw, nh } = layoutRow(row, x, y, w, h);
      rects.push(...out);
      recurse(remaining, [], nx, ny, nw, nh);
    }
  }
  recurse(scaled, [], x, y, w, h);
  return rects;
}
function renderTreemap() {
  const container = document.getElementById('treemap-wrap');
  if (!container) return;
  const w = container.clientWidth;
  const totalH = 260;
  const coreHoldings = state.portfolio.filter(h=>h.type==='core');
  const satHoldings = state.portfolio.filter(h=>h.type!=='core');
  const coreVal = coreHoldings.reduce((s,h)=>s+holdingKRW(h).value,0);
  const satVal = satHoldings.reduce((s,h)=>s+holdingKRW(h).value,0);
  const totalVal = (coreVal+satVal) || 1;
  let hCore;
  if (coreVal>0 && satVal>0) { hCore = Math.min(Math.max(totalH*coreVal/totalVal, 50), totalH-50); }
  else if (coreVal>0) { hCore = totalH; } else { hCore = 0; }
  const hSat = totalH - hCore;

  function bandHtml(holdings, val, label, bandH) {
    if (!holdings.length || bandH<=0) return '';
    const items = holdings.map(h => ({ h, value: Math.max(holdingKRW(h).value,1) }));
    const rects = squarify(items, 0, 0, w, bandH);
    const tiles = rects.map(r => {
      const h = r.h;
      const ret = h.avgPrice>0 ? (h.currentPrice-h.avgPrice)/h.avgPrice*100 : 0;
      const color = retColor(ret);
      const showText = r.rw>44 && r.rh>28;
      return `<div class="absolute rounded-[6px] flex flex-col items-center justify-center overflow-hidden" style="left:${r.rx}px;top:${r.ry}px;width:${Math.max(r.rw-2,0)}px;height:${Math.max(r.rh-2,0)}px;background:${color}">
        ${showText ? `<span class="text-[11px] font-bold leading-tight px-1 truncate w-full text-center text-white">${escapeHtml(h.name)}</span><span class="text-[10px] leading-tight text-white/90">${fmtPct(ret)}</span>` : ''}
      </div>`;
    }).join('');
    return `<p class="text-[11px] text-muted font-semibold mb-1">${label} · ${fmtWon(val)}</p><div class="relative mb-2" style="width:100%;height:${bandH}px">${tiles}</div>`;
  }
  container.innerHTML = bandHtml(coreHoldings, coreVal, '🔵 코어', hCore) + bandHtml(satHoldings, satVal, '🟢 위성', hSat);
}

      ${!canUseAI() ? '<p class="text-xs text-warn">⚠️ Google 로그인을 하면 하루 3회 무료로 AI 검증을 받을 수 있어요. (더보기 → 설정에서 본인 API 키를 등록하면 무제한)</p>' : (!hasApiKey() ? '<p class="text-xs text-muted">무료 AI로 검증합니다 (하루 3회). 더 빠르고 무제한으로 쓰려면 설정에서 본인 API 키를 등록하세요.</p>' : '')}
    </div>

    <div id="fc-result"></div>

    <div class="mt-6">
      <p class="text-sm font-semibold mb-2">최근 기록</p>
      <div id="fc-history" class="space-y-2"></div>
    </div>
  `;
  document.getElementById('fc-run').onclick = runFactCheck;
  const hist = document.getElementById('fc-history');
  const items = [...state.factchecks].reverse().slice(0,10);
  hist.innerHTML = items.length===0 ? '<p class="text-xs text-muted">아직 기록이 없습니다.</p>' : items.map(f => {
    const v = f.result?.verdict || '오류';
    const color = v==='위배' ? 'text-bad' : v==='주의' ? 'text-warn' : v==='양호' ? 'text-good' : 'text-muted';
    return `<div class="row p-3.5 flex items-center justify-between text-sm">
      <div><span class="font-semibold">${escapeHtml(f.ticker)}</span> <span class="text-xs text-muted">${f.date}</span></div>
      <span class="font-bold ${color}">${escapeHtml(v)}</span>
    </div>`;
  }).join('');
};

function verdictStyle(v) {
  if (v === '위배') return { color:'text-bad', bg:'bg-bad/10', border:'border-bad/30', emoji:'🚫' };
  if (v === '주의') return { color:'text-warn', bg:'bg-warn/10', border:'border-warn/30', emoji:'⚠️' };
  return { color:'text-good', bg:'bg-good/10', border:'border-good/30', emoji:'✅' };
}

async function runFactCheck() {
  const ticker = document.getElementById('fc-ticker').value.trim();
  const amount = document.getElementById('fc-amount').value.trim();
  const reason = document.getElementById('fc-reason').value.trim();
  if (!ticker || !reason) { toast('종목명과 이유는 필수입니다.', 'warn'); return; }
  if (!canUseAI()) { toast('무료 AI를 쓰려면 Google 로그인을 해주세요. (또는 설정에서 본인 API 키 등록)', 'error'); switchTab('settings'); return; }

  const resultBox = document.getElementById('fc-result');
  resultBox.innerHTML = `<div class="card p-6 text-center text-sm text-muted"><span class="inline-block spin">⏳</span> AI가 원칙을 대조하는 중...</div>`;

  const stats = computePortfolioStats();
  const principlesText = state.principles.length
    ? state.principles.map(p => `- [${p.source}] ${p.title}: ${p.body.replace(/\n/g,' ')}`).join('\n')
    : '(등록된 원칙 없음 — 일반적인 건전 투자 원칙 기준으로 판단할 것)';
  const portfolioText = state.portfolio.length
    ? state.portfolio.map(h => `- ${h.name}(${h.type==='core'?'코어':'위성'}): 평가금액 ${Math.round(holdingKRW(h).value).toLocaleString()}원`).join('\n')
    : '(등록된 보유 종목 없음)';
  const recentJournal = state.journal.slice(-3).map(j => `- ${j.date}: ${j.content.slice(0,80)}`).join('\n') || '(기록 없음)';

  const systemPrompt = `당신은 '포모가드'라는 개인 투자 집사 AI입니다. 사용자의 등록된 투자 원칙과 현재 포트폴리오, 최근 투자 일지를 참고하여, 사용자가 지금 하려는 투자가 그 원칙에 부합하는지 냉철하고 직설적으로 검증합니다. 근거 없는 응원이나 막연한 긍정은 금지합니다. 감정적 동조보다 사실과 논리를 우선하되, 무례하거나 모욕적이지는 않게 말합니다. 반드시 아래 JSON 형식으로만, 다른 텍스트 없이 답하세요:
{"verdict":"위배 | 주의 | 양호","score":0-100 사이 정수(원칙 부합도),"summary":"핵심 총평 한두 문장","reasons":["근거 또는 우려 사항 1","근거 2","근거 3"],"advice":"지금 취해야 할 구체적 행동 조언 두세 문장"}`;

  const userPrompt = `[나의 투자 원칙]\n${principlesText}\n\n[현재 포트폴리오 요약]\n총 평가금액: ${Math.round(stats.totalValue).toLocaleString()}원, 누적 수익률: ${stats.returnPct.toFixed(1)}%\n${portfolioText}\n\n[최근 투자 일지]\n${recentJournal}\n\n[지금 하려는 투자]\n종목: ${ticker}\n예정 금액: ${amount ? Math.round(+amount).toLocaleString()+'원' : '미입력'}\n이유: ${reason}\n\n위 정보를 바탕으로 이 투자가 나의 원칙에 부합하는지 JSON으로만 답변하세요.`;

  try {
    const text = await callAI({ system: systemPrompt, user: userPrompt, maxTokens: 2500 });
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('AI 응답을 해석할 수 없습니다.');
    const result = JSON.parse(jsonMatch[0]);

    const record = { id: uid(), date: todayStr(), ticker, amount: amount ? +amount : null, reason, result };
    state.factchecks.push(record);
    save(LS.factchecks, state.factchecks);

    renderers.factcheck();
    renderFactCheckResult(result);
  } catch (err) {
    resultBox.innerHTML = `<div class="card p-5 border border-bad/30 text-sm">
      <p class="font-semibold text-bad mb-1">검증 실패</p>
      <p class="text-muted">${escapeHtml(err.message)}</p>
      <p class="text-xs text-muted mt-2">API 키가 올바른지, 크레딧이 남아있는지 설정에서 확인해주세요.</p>
    </div>`;
    toast('AI 호출 중 오류가 발생했습니다.', 'error');
  }
}

function renderFactCheckResult(result) {
  const box = document.getElementById('fc-result');
  if (!box) return;
  const s = verdictStyle(result.verdict);
  box.innerHTML = `
    <div class="card p-5 border ${s.border} ${s.bg} fade-in">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-3xl">${s.emoji}</span>
        <div>
          <p class="text-xl font-bold ${s.color}">${escapeHtml(result.verdict)}</p>
          <p class="text-xs text-muted">원칙 부합도 ${escapeHtml(String(result.score ?? '-'))}점</p>
        </div>
      </div>
      <p class="text-sm mb-3">${escapeHtml(result.summary||'')}</p>
      ${Array.isArray(result.reasons) && result.reasons.length ? `
        <ul class="text-sm list-disc list-inside space-y-1 mb-3 text-[#c6cbd9]">
          ${result.reasons.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}
        </ul>` : ''}
      <div class="border-t border-line pt-3 mt-3">
        <p class="text-xs text-muted mb-1">💡 조언</p>
        <p class="text-sm">${escapeHtml(result.advice||'')}</p>
      </div>
    </div>
  `;
}

function openTradeForm(h) {
  let mode = 'buy';
  function render() {
    const cur = h.currency||'KRW';
    openModal(`${escapeHtml(h.name)} 거래하기`, `
      <div class="seg mb-4" id="trade-seg"><button data-m="buy" class="${mode==='buy'?'active':''}">매수</button><button data-m="sell" class="${mode==='sell'?'active':''}">매도</button></div>
      <p class="text-xs text-muted mb-3">현재 보유: ${h.quantity}주 · 평단 ${fmtPrice(h.avgPrice,cur)}</p>
      <div class="space-y-3">
        <div><label class="text-xs text-muted mb-1 block">수량</label><input id="tf-qty" type="number" placeholder="주식 수"></div>
        <div><label class="text-xs text-muted mb-1 block">${mode==='buy'?'매수':'매도'} 가격 (${cur} 기준, 1주당)</label><input id="tf-price" type="number" step="0.01" value="${h.currentPrice}"></div>
      </div>
      <div id="trade-preview" class="row p-3 mt-3 text-xs text-muted">수량과 가격을 입력하면 결과 미리보기가 표시됩니다.</div>
    `, `
      <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm" onclick="closeModal()">취소</button>
      <button id="tf-submit" class="btn-brand px-4 py-2.5 rounded-xl text-sm">${mode==='buy'?'매수 기록':'매도 기록'}</button>
    `);
    document.querySelectorAll('#trade-seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
    const updatePreview = () => {
      const qty = +document.getElementById('tf-qty').value || 0;
      const price = +document.getElementById('tf-price').value || 0;
      const box = document.getElementById('trade-preview');
      if (!qty || !price) { box.textContent = '수량과 가격을 입력하면 결과 미리보기가 표시됩니다.'; return; }
      if (mode === 'buy') {
        const newQty = h.quantity+qty;
        const newAvg = (h.quantity*h.avgPrice + qty*price)/newQty;
        box.innerHTML = `매수 후: ${newQty}주 · 평단 ${fmtPrice(newAvg,cur)}`;
      } else {
        if (qty > h.quantity) { box.innerHTML = `<span class="text-bad">보유 수량(${h.quantity}주)보다 많습니다.</span>`; return; }
        const pnl = (price-h.avgPrice)*qty;
        const pct = h.avgPrice>0 ? (price-h.avgPrice)/h.avgPrice*100 : 0;
        box.innerHTML = `매도 후: ${h.quantity-qty}주 남음 · 실현손익 <span class="${pnl>=0?'text-up':'text-down'}">${pnl>=0?'+':''}${fmtPrice(pnl,cur)} (${fmtPct(pct)})</span>`;
      }
    };
    document.getElementById('tf-qty').oninput = updatePreview;
    document.getElementById('tf-price').oninput = updatePreview;
    document.getElementById('tf-submit').onclick = () => {
      const qty = +document.getElementById('tf-qty').value;
      const price = +document.getElementById('tf-price').value;
      if (!qty || qty<=0 || !price || price<=0) { toast('수량과 가격을 올바르게 입력해주세요.', 'warn'); return; }
      if (mode==='sell' && qty > h.quantity) { toast('보유 수량보다 많이 팔 수 없습니다.', 'warn'); return; }
      if (mode === 'buy') {
        const newQty = h.quantity+qty;
        const newAvg = (h.quantity*h.avgPrice + qty*price)/newQty;
        h.quantity = newQty; h.avgPrice = newAvg; h.currentPrice = price;
        state.transactions.push({ id:uid(), date:todayStr(), holdingId:h.id, name:h.name, ticker:h.ticker, type:'buy', currency:cur, quantity:qty, price, avgPriceAtTime:newAvg, realizedPnL:null });
        recordCashFlow('buy', -(qty*price*(cur==='USD'?(state.fx.rate||1):1)), `${h.name} 매수`);
      } else {
        const pnl = (price-h.avgPrice)*qty;
        state.transactions.push({ id:uid(), date:todayStr(), holdingId:h.id, name:h.name, ticker:h.ticker, type:'sell', currency:cur, quantity:qty, price, avgPriceAtTime:h.avgPrice, realizedPnL:pnl });
        recordCashFlow('sell', qty*price*(cur==='USD'?(state.fx.rate||1):1), `${h.name} 매도`);
        h.quantity -= qty; h.currentPrice = price;
        if (h.quantity <= 0) { state.portfolio = state.portfolio.filter(x=>x.id!==h.id); }
      }
      save(LS.portfolio, state.portfolio); save(LS.transactions, state.transactions);
      snapshotToday();
      closeModal(); renderers.portfolio(); toast(mode==='buy' ? '매수 기록을 저장했습니다.' : '매도 기록을 저장했습니다.', 'success');
    };
  }
  render();
}

function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => resolve(null);
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    <button class="btn-ghost px-4 py-2.5 rounded-xl text-sm" onclick="closeModal()">취소</button>
    <button id="jf-save" class="btn-brand px-4 py-2.5 rounded-xl text-sm">저장</button>
  `);
  renderPhotoPreview();

  document.getElementById('jf-photo').onchange = async (e) => {
    const files = [...e.target.files];
    let failed = 0;
    for (const f of files) {
      const compressed = await compressImage(f);
      if (compressed) pendingPhotos.push(compressed); else failed++;
    }
    if (failed) toast(`${failed}개 파일은 이미지로 인식되지 않아 제외했습니다.`, 'warn');
    renderPhotoPreview();
    e.target.value = '';
  };

  document.getElementById('jf-save').onclick = () => {
    const date = document.getElementById('jf-date').value || todayStr();
    const mood = document.getElementById('jf-mood').value;
    const title = document.getElementById('jf-title').value.trim();
    const content = document.getElementById('jf-content').value.trim();
    const hashtags = document.getElementById('jf-tags').value.split(',').map(t=>t.trim().replace(/^#/,'')).filter(Boolean);
    if (!content) { toast('내용을 입력해주세요.', 'warn'); return; }
    if (existing) {
      Object.assign(existing, { date, mood, title, content, photos: pendingPhotos, hashtags });
    } else {
      state.journal.push({ id: uid(), date, mood, title, content, photos: pendingPhotos, hashtags });
    }
    state.journal.sort((a,b)=>a.date.localeCompare(b.date));
    save(LS.journal, state.journal);
    closeModal(); renderers.journal(); toast(existing ? '일지를 수정했습니다.' : '일지를 저장했습니다.', 'success');
  };
}

    inp.type = inp.type === 'password' ? 'text' : 'password';
  };

  async function loadModelsIntoDropdown() {
    const p = state.settings.provider;
    const key = document.getElementById('st-apikey').value.trim();
    const statusEl = document.getElementById('st-model-status');
    const sel = document.getElementById('st-model');
    if (!key) { statusEl.textContent = ''; return; }
    statusEl.textContent = '모델 목록을 불러오는 중...';
    const models = await fetchModelList(p, key);
    if (models && models.length) {
      modelListCache[p] = models;
      sel.innerHTML = models.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
      const preferred = (state.settings.models||{})[p];
      if (preferred && models.includes(preferred)) sel.value = preferred;
      statusEl.innerHTML = `<span class="text-good">✓ ${models.length}개 모델을 불러왔습니다.</span>`;
    } else {
      statusEl.innerHTML = `<span class="text-warn">모델 목록을 불러오지 못했습니다. 키를 확인하거나 기본 목록에서 선택하세요.</span>`;
    }
  }
  async function handleApiKeyAutoDetect() {
    const inp = document.getElementById('st-apikey');
    const key = inp.value.trim();
    if (!key) return;
    const detected = detectProviderFromKey(key);
    if (detected && detected !== state.settings.provider) {
      state.settings.provider = detected;
      document.querySelectorAll('#st-provider-grid [data-provider]').forEach(b => {
        const active = b.dataset.provider === detected;
        b.classList.toggle('ring-2', active); b.classList.toggle('ring-brand', active); b.classList.toggle('text-brand', active); b.classList.toggle('text-[#c6cbd9]', !active);

      document.getElementById('st-model-status').innerHTML = `<span class="text-brand">${AI_PROVIDERS[detected].label} 키로 인식되었습니다.</span>`;
    }

  }
  document.getElementById('st-apikey').addEventListener('blur', handleApiKeyAutoDetect);

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fomoguard-backup-${todayStr()}.json`;
    a.click();
    toast('백업 파일을 생성했습니다.', 'success');
  };
  document.getElementById('st-import').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.principles) { state.principles = data.principles; save(LS.principles, state.principles); }
        if (data.portfolio) { state.portfolio = data.portfolio; save(LS.portfolio, state.portfolio); }
        if (data.journal) { state.journal = data.journal; save(LS.journal, state.journal); }
        if (data.transactions) { state.transactions = data.transactions; save(LS.transactions, state.transactions); }
        if (data.factchecks) { state.factchecks = data.factchecks; save(LS.factchecks, state.factchecks); }
        if (data.snapshots) { state.snapshots = data.snapshots; save(LS.snapshots, state.snapshots); }
        if (data.newsKeywords) { state.newsKeywords = data.newsKeywords; save(LS.newsKeywords, state.newsKeywords); }
        if (data.cashFlows) { state.cashFlows = data.cashFlows; save(LS.cashFlows, state.cashFlows); }
        toast('데이터를 복원했습니다.', 'success');
        switchTab('dashboard');
      } catch (err) { toast('파일을 읽을 수 없습니다.', 'error'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('st-reset').onclick = () => {
    confirmModal('정말 초기화할까요?', '이 작업은 되돌릴 수 없습니다. 초기화 전 백업을 권장합니다.', () => {
      Object.values(LS).forEach(k => k !== LS.settings && localStorage.removeItem(k));
      localStorage.removeItem('fomoguard_last_sync_date');
      state.principles = []; state.portfolio = []; state.journal = []; state.transactions = []; state.factchecks = []; state.snapshots = []; state.cashFlows = [];
      state.fx = { rate:null, updatedAt:null }; state.marketSnapshot = null; state.dailyAnalysis = null; state.newsKeywords = []; state.newsCache = {}; state.profile = null;
      renderHeaderProfile();
      switchTab('dashboard'); toast('모든 데이터를 초기화했습니다.');
    }, '초기화');
  };
};

/* ================= TAB ORDER EDITOR ================= */
renderers.taborder = function() {
  const el = document.getElementById('panel-taborder');
  const order = state.settings.tabOrder;
  el.innerHTML = `
    <h2 class="font-bold text-xl mt-2 mb-1">🔀 탭 순서 편집</h2>
    <p class="text-xs text-muted mb-4">🧊 포모체크는 항상 하단 메뉴 정중앙에 고정됩니다. 아래 목록 중 위 3개가 나머지 하단 메뉴 자리에 표시돼요.</p>
    <div id="order-list" class="space-y-2"></div>
  `;
  function renderList() {
    document.getElementById('order-list').innerHTML = order.map((t,i) => `
      <div class="row p-3.5 flex items-center justify-between ${i<3?'':'opacity-60'}">
        <div class="flex items-center gap-3">
          <span class="text-[10px] font-bold w-4 text-center ${i<3?'text-brand':'text-muted'}">${i+1}</span>
          ${iconBadge(TAB_META[t].icon, TAB_META[t].color, 34)}
          <span class="text-sm font-semibold">${TAB_META[t].label}</span>
          ${i<3?'<span class="badge bg-brand/15 text-brand">하단 메뉴</span>':''}
        </div>
        <div class="flex gap-1">
          <button data-up="${i}" class="btn-ghost w-8 h-8 rounded-lg text-sm" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
          <button data-down="${i}" class="btn-ghost w-8 h-8 rounded-lg text-sm" ${i===order.length-1?'disabled style="opacity:.3"':''}>↓</button>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
      const i = +b.dataset.up; if (i===0) return;
      [order[i-1], order[i]] = [order[i], order[i-1]];
      state.settings.tabOrder = order; save(LS.settings, state.settings);
      renderList(); renderBottomNav();
    });
    document.querySelectorAll('[data-down]').forEach(b => b.onclick = () => {
      const i = +b.dataset.down; if (i===order.length-1) return;
      [order[i+1], order[i]] = [order[i], order[i+1]];
      state.settings.tabOrder = order; save(LS.settings, state.settings);
      renderList(); renderBottomNav();
    });
  }
  renderList();
};

  }
  if (localStorage.getItem('fomoguard_last_sync_date') !== todayStr()) {
    await refreshMarketData(false);
  }
  switchTab('dashboard');
}
init();
